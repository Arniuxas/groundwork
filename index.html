<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groundwork</title>
<meta name="description" content="Groundwork – vadybos simuliacija vadovams. Vadovauk komandai ir pamatyk pasekmes.">
<meta name="theme-color" content="#F4F5F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1217" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one calm phone-width column with editorial type; a tonal five-band pyramid is the only graphic */
:root{
  --bg:#F4F5F6; --surface:#FFFFFF; --ink:#111A23; --muted:#5D6772; --line:#E0E4E8; --tint:#ECEFF2; --focus:#3C6FA8;
  --accent:#1C3550; --accent-ink:#FFFFFF;
  --l-trust:#1C3550; --l-conflict:#2D4D72; --l-commitment:#466A93; --l-accountability:#6C8BB0; --l-results:#9AB0CB;
  --good:#2C7357; --bad:#A8443A; --mark:#8E6E2F;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1217; --surface:#141B22; --ink:#E7EBEE; --muted:#97A2AD; --line:#26303A; --tint:#1B242D; --focus:#8DB2DE;
  --accent:#C9D7E8; --accent-ink:#0D1217;
  --l-trust:#A3C0E2; --l-conflict:#84A6CF; --l-commitment:#688CB6; --l-accountability:#52739A; --l-results:#415C7C;
  --good:#6CC29C; --bad:#E08A80; --mark:#D2B06E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1217; --surface:#141B22; --ink:#E7EBEE; --muted:#97A2AD; --line:#26303A; --tint:#1B242D; --focus:#8DB2DE;
  --accent:#C9D7E8; --accent-ink:#0D1217;
  --l-trust:#A3C0E2; --l-conflict:#84A6CF; --l-commitment:#688CB6; --l-accountability:#52739A; --l-results:#415C7C;
  --good:#6CC29C; --bad:#E08A80; --mark:#D2B06E; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.55;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:22px;
  padding-left:max(18px, env(safe-area-inset-left,0px));padding-right:max(18px, env(safe-area-inset-right,0px));padding-block:10px 36px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font:600 21px/1 var(--f-display);letter-spacing:-.01em;background:none;border:0;color:inherit;cursor:pointer;padding:6px 0}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;font:500 11.5px/1 var(--f-mono);letter-spacing:.08em;padding:7px 10px;border-radius:6px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--tint);color:var(--ink)}
main{display:flex;flex-direction:column;gap:22px;flex:1;animation:rise .4s ease both}
@keyframes rise{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:500;letter-spacing:-.015em;line-height:1.12}
h1{font-size:38px}
h2{font-size:29px}
h3{font-size:19px}
p{margin:0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.lead{font-size:16.5px;color:var(--muted);line-height:1.55}
.small{font-size:13.5px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.stack.tight{gap:8px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{appearance:none;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 15px/1.2 var(--f-body);letter-spacing:.01em;padding:15px 18px;cursor:pointer;width:100%;transition:opacity .15s}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--muted);opacity:1}
.btn.danger{background:transparent;color:var(--bad);border-color:transparent;font-weight:500;font-size:14px;padding:10px}
.link{background:none;border:0;padding:4px 0;color:var(--ink);font:500 14px var(--f-body);cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted);align-self:flex-start}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.features{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.features li{display:grid;grid-template-columns:92px 1fr;gap:12px;align-items:baseline;padding:13px 0;border-bottom:1px solid var(--line)}
.features b{font:500 11px/1.4 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.progress{height:2px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.count{font:500 12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.back{background:none;border:0;color:var(--muted);font:500 14px var(--f-body);cursor:pointer;padding:6px 0}
.qtext{font:500 25px/1.25 var(--f-display);letter-spacing:-.01em;text-wrap:balance}
.opt{text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:15px 16px;font:400 15.5px/1.45 var(--f-body);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.likert{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.likert button{height:54px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:500 16px var(--f-mono);cursor:pointer}
.likert button:hover{border-color:var(--muted)}
.likert button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.likert-labels{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted)}

.pyr svg{width:100%;height:auto;display:block;max-width:380px;margin:0 auto;overflow:visible}
.pyr .ring{fill:none;stroke:var(--line);stroke-width:1}
.pyr .spoke{stroke:var(--line);stroke-width:1}
.pyr .area{fill:color-mix(in srgb,var(--accent) 14%,transparent);stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.pyr .ghost{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:4 4}
.pyr .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.pyr .dot.weak{fill:var(--mark)}
.pyr .lbl{font:500 11.5px var(--f-body);fill:var(--muted)}
.pyr .lbl .v{font:600 14px var(--f-mono);fill:var(--ink)}
.pyr .lbl.weak .v,.pyr .lbl.weak{fill:var(--mark)}
.legend{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.lg{display:grid;grid-template-columns:10px 1fr auto;gap:6px 12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.lg .sw{width:10px;height:10px;border-radius:2px}
.lg .nm{font-weight:500;font-size:14.5px;min-width:0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lg .val{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.lg .note{grid-column:2 / 4;font-size:12.5px;color:var(--muted)}
.lg .bar{grid-column:2 / 4;height:3px;background:var(--tint);overflow:hidden}
.lg .bar i{display:block;height:100%}
.chip{display:inline-flex;align-items:center;gap:6px;font:500 10.5px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;align-self:flex-start}
.chip.warn{border-color:var(--mark);color:var(--mark)}
.status{font:500 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.deltas{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.delta{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.delta b{font:600 14px var(--f-mono);color:var(--good)}
.delta b.neg{color:var(--bad)}

.team{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.mate{display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;min-width:0}
.mate span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;font:500 18px var(--f-display);background:var(--tint);color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ring,var(--line));transition:box-shadow .4s}
.av.sm{width:32px;height:32px;font-size:15px;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring,var(--line))}
.person{display:grid;grid-template-columns:42px 1fr;gap:14px;align-items:start;padding-block:14px;border-bottom:1px solid var(--line)}
.people{border-top:1px solid var(--line)}
.person .who{font-weight:600}
.person .role{font-weight:400;font-size:13px;color:var(--muted)}
.mood{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.scene{font:400 19px/1.5 var(--f-display)}
.say{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start}
.bubble{background:var(--surface);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:10px 14px;min-width:0;font-size:15px}
.bubble .n{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:3px}
.picked{font:italic 400 19px/1.45 var(--f-display);color:var(--ink)}
.insight{background:var(--tint);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:8px}
.insight p{font:400 17.5px/1.5 var(--f-display)}
.trap{border:1px solid var(--mark);border-radius:12px;padding:14px 16px;font-size:14.5px;display:flex;flex-direction:column;gap:6px}
.trap .eyebrow{color:var(--mark)}
.task{border:1px solid var(--ink);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px;background:var(--surface)}
.task q{font:400 20px/1.4 var(--f-display);quotes:none}

.chapters{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ch{display:grid;grid-template-columns:40px 1fr auto;gap:14px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
.ch .code{font:500 12.5px var(--f-mono);width:40px;height:40px;border-radius:8px;display:grid;place-items:center;border:1px solid var(--line);color:var(--ink)}
.ch.open .code{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ch.locked .t,.ch.locked .code{color:var(--muted)}
.ch .t{font-weight:600;line-height:1.3}
.ch .s{font-size:13px;color:var(--muted)}
.ch > div{min-width:0}
.ch button{width:auto;padding:9px 14px;font-size:14px}
.style-card{display:flex;flex-direction:column;gap:6px}
.style-card .sn{font:500 26px/1.1 var(--f-display)}
.foot{font-size:12px;color:var(--muted);text-align:center;padding-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:flex-end}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.meter.wide{grid-column:1 / -1}
.meter .k{font:500 10.5px/1.2 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:600 19px var(--f-mono);font-variant-numeric:tabular-nums}
.meter .v small{font-size:12px;color:var(--muted);font-weight:500}
.track{display:block;height:4px;background:var(--tint);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.weekbar{display:flex;align-items:center;justify-content:space-between;gap:12px}
.pcs{display:flex;flex-direction:column;gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.pc.open{border-color:var(--muted)}
.pc.gone{opacity:.55}
.pc-head{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;padding:14px 14px 10px;text-align:left;color:inherit;font:inherit;cursor:pointer}
.pc-id{display:flex;flex-direction:column;min-width:0}
.pc-id .who{font-weight:600;line-height:1.25}
.pc-id .role{font-size:12.5px;color:var(--muted)}
.pc-bars{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px 14px 68px}
.pc-bars.inline{padding:6px 0 0}
.mini{display:flex;flex-direction:column;gap:5px;min-width:0}
.mini .k{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pc-plan{padding:0 14px 12px 68px;font-size:12.5px;color:var(--accent);font-weight:500}
.pc-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px 14px;border-top:1px solid var(--line);background:var(--bg)}
.team-acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-width:0}
.act b{font-weight:600;font-size:14px;line-height:1.3}
.act span{font-size:12px;color:var(--muted);line-height:1.35}
.act .cost{font:500 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.act:hover:not(:disabled){border-color:var(--muted)}
.act:disabled{opacity:.4;cursor:not-allowed}
.act.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.slots{display:flex;flex-direction:column;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;border:1px dashed var(--line);border-radius:10px;font-size:14px;min-height:42px;color:var(--muted)}
.slot.full{border-style:solid;background:var(--surface);color:var(--ink)}
.slot .x{background:none;border:0;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px;line-height:1}
.dock{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 75%,transparent)}
.mentor{border:1px solid var(--mark);border-radius:12px;padding:12px 14px;font-size:14.5px}
.mentor .eyebrow{color:var(--mark)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--good);color:var(--good)}
.levers{display:flex;flex-direction:column;gap:8px}
.opt.listen{border-color:var(--accent);font-weight:500}
.opt.type{display:flex;flex-direction:column;gap:4px;padding:18px}
.opt.type b{font:500 21px var(--f-display)}
.opt.type span{color:var(--muted);font-size:14.5px}
.person.solo{border:0;padding:0;grid-template-columns:42px 1fr}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.prow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.prow .who{font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .st{font:600 14px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:78px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.timeline .w{font:500 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-top:3px}
.timeline li.bad .w{color:var(--bad)}
.timeline li.good .w{color:var(--good)}
.side .rows .prow{padding:8px 0}
.side{display:none}
@media (min-width:960px){
  .app{max-width:1120px;gap:28px;padding-block:16px 56px}
  .shell{display:grid;grid-template-columns:minmax(0,540px) minmax(0,1fr);gap:72px;align-items:start;padding-top:12px}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:24px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:32px}
  .side .pyr svg{max-width:440px}
  .side .person{grid-template-columns:32px 1fr;padding-block:10px;gap:12px}
  main .pyr{display:none}
  h1{font-size:52px}
  h2{font-size:36px}
  .qtext{font-size:30px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

</head>
<body>
<div class="app" id="app"></div>

<script>
const LAYERS = ['trust','conflict','commitment','accountability','results'];
const LAYER = {
  trust:{short:{lt:'Pasitikėjimas',en:'Trust'},lt:'Pasitikėjimas',en:'Trust',
    weak:{lt:'Žmonės slepia klaidas ir neprašo pagalbos. Kol šis sluoksnis silpnas, kiti negali tvirtai augti.',en:'People hide mistakes and don’t ask for help. While this layer is weak, the others can’t grow solidly.'}},
  conflict:{short:{lt:'Konfliktas',en:'Conflict'},lt:'Konstruktyvus konfliktas',en:'Healthy conflict',
    weak:{lt:'Susirinkimuose visi sutinka, o tikros diskusijos vyksta koridoriuose.',en:'Everyone agrees in meetings; the real discussions happen in the hallway.'}},
  commitment:{short:{lt:'Įsipareigojimas',en:'Commitment'},lt:'Įsipareigojimas',en:'Commitment',
    weak:{lt:'Sprendimai lieka „ore“: išėję iš susirinkimo žmonės juos supranta skirtingai.',en:'Decisions stay up in the air: people leave the meeting with different understandings.'}},
  accountability:{short:{lt:'Atskaitomybė',en:'Accountability'},lt:'Atskaitomybė',en:'Accountability',
    weak:{lt:'Susitarimų laikymąsi prižiūri tik vadovas. Kolegos vieni kitiems pastabų nesako.',en:'Only the manager checks that agreements are kept. Colleagues don’t hold each other to them.'}},
  results:{short:{lt:'Rezultatai',en:'Results'},lt:'Dėmesys rezultatams',en:'Focus on results',
    weak:{lt:'Kiekvienas gina savo sritį, net kai komanda kaip visuma pralaimi.',en:'Everyone defends their own area, even when the team as a whole loses.'}}
};

const STYLES = {
  avoider:{name:{lt:'Taikdarys',en:'Peacekeeper'},
    desc:{lt:'Saugai ramybę komandoje. Tai stiprybė, bet tylą lengva supainioti su sutarimu.',en:'You protect the calm in the team. That’s a strength, but it’s easy to mistake silence for agreement.'},
    trap:{lt:'Testas parodė polinkį vengti nemalonių momentų. Šis pasirinkimas būtent toks: trumpam ramiau, bet problema lieka.',en:'Your test showed a tendency to avoid uncomfortable moments. This choice is exactly that: calmer for now, but the problem stays.'}},
  controller:{name:{lt:'Kapitonas',en:'Captain'},

/* ---------- state ---------- */
const KEY='groundwork.v2';
function fresh(){return {lang:'lt',screen:'welcome',qi:0,answers:{},raw:null,level:null,style:null,g:null,openP:null,commitment:null,checkin:null,bonus:0}}
let S=fresh();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const j=localStorage.getItem(KEY);if(j)S=Object.assign(fresh(),JSON.parse(j))}catch(e){}}

const t=o=>(o&&(o[S.lang]??o.lt))||'';
const tx=o=>{if(!o)return '';if(o.sales||o.project)o=o[S.g?S.g.type:'sales'];return t(o)};
const u=k=>t(UI[k]);
const pn=id=>t(PEOPLE[id].n);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const NL=(id,lt,en)=>L(`${PEOPLE[id].n.lt}${lt}`,`${PEOPLE[id].n.en}${en}`);

/* ---------- test & culture map ---------- */
function effective(raw){
  const eff={},cap={};let prev=null;
  LAYERS.forEach(l=>{let v=raw[l];if(prev!==null&&v>prev+15){v=prev+15;cap[l]=true}eff[l]=v;prev=v});
  return {eff,cap};
}
function weakestLayer(raw){return LAYERS.reduce((a,b)=>raw[b]<raw[a]?b:a)}
function computeProfile(){
  const A=S.answers,raw={};
  LAYERS.forEach(l=>{const items=Q.filter(q=>q.layer===l);const avg=items.reduce((s,q)=>s+(q.rev?6-A[q.id]:A[q.id]),0)/items.length;raw[l]=Math.round(15+(avg-1)/4*70)});
  S.raw=raw;S.level=(A.mgrs===1||A.years>=2)?'senior':'novice';
  const tally={avoider:0,controller:0,rescuer:0,coach:0};
  ['s1','s2','s3'].forEach(id=>{const q=Q.find(x=>x.id===id);tally[q.opts[A[id]].s]++});
  S.style=['avoider','controller','rescuer','coach'].reduce((a,b)=>tally[b]>tally[a]?b:a);
}

const RC={x:180,y:146,r:104};
function radarPt(i,v){const a=-Math.PI/2+i*2*Math.PI/LAYERS.length,r=RC.r*v/100;return [RC.x+r*Math.cos(a),RC.y+r*Math.sin(a)]}
function polyStr(vals){return LAYERS.map((l,i)=>radarPt(i,vals[l]).map(n=>n.toFixed(1)).join(',')).join(' ')}
function radarSVG(raw,opts={}){
  const {eff}=effective(raw);const start=opts.from?effective(opts.from).eff:eff;const weak=opts.weak;let g='';
  [25,50,75,100].forEach(v=>g+=`<circle class="ring" cx="${RC.x}" cy="${RC.y}" r="${RC.r*v/100}"/>`);
  LAYERS.forEach((l,i)=>{const [x,y]=radarPt(i,100);g+=`<line class="spoke" x1="${RC.x}" y1="${RC.y}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`});
  if(opts.ghost)g+=`<polygon class="ghost" points="${polyStr(effective(opts.ghost).eff)}"/>`;
  g+=`<polygon class="area" points="${polyStr(start)}"/>`;
  LAYERS.forEach((l,i)=>{const [x,y]=radarPt(i,start[l]);g+=`<circle class="dot${l===weak?' weak':''}" data-dot="${l}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${l===weak?5.5:4.5}"/>`});
  LAYERS.forEach((l,i)=>{const a=-Math.PI/2+i*2*Math.PI/LAYERS.length,c=Math.cos(a),s=Math.sin(a);const [x,y]=radarPt(i,118);
    const anchor=c>0.3?'start':c<-0.3?'end':'middle';const dy=s<-0.9?-16:s>0.5?6:-4;
    g+=`<text class="lbl${l===weak?' weak':''}" x="${x.toFixed(1)}" y="${(y+dy).toFixed(1)}" text-anchor="${anchor}"><tspan x="${x.toFixed(1)}">${esc(t(LAYER[l].short))}</tspan><tspan class="v" x="${x.toFixed(1)}" dy="16" data-num="${l}">${start[l]}</tspan></text>`});
  return `<svg viewBox="0 0 360 296" role="img" aria-label="${esc(LAYERS.map(l=>t(LAYER[l])+' '+eff[l]).join(', '))}" data-to='${JSON.stringify(eff)}'>${g}</svg>`;
}
function animateRadar(root,from){
  if(!root||!from)return;
  const svg=root.querySelector('svg'),a=effective(from).eff,b=JSON.parse(svg.dataset.to),area=svg.querySelector('.area');
  const dur=matchMedia('(prefers-reduced-motion: reduce)').matches?0:1000,t0=performance.now();
  const step=now=>{const k=dur?Math.min(1,(now-t0)/dur):1,e=1-Math.pow(1-k,3),cur={};
    LAYERS.forEach(l=>cur[l]=a[l]+(b[l]-a[l])*e);area.setAttribute('points',polyStr(cur));
    LAYERS.forEach((l,i)=>{const [x,y]=radarPt(i,cur[l]);const d=svg.querySelector(`[data-dot="${l}"]`);d.setAttribute('cx',x);d.setAttribute('cy',y);svg.querySelector(`[data-num="${l}"]`).textContent=Math.round(cur[l])});
    if(k<1)requestAnimationFrame(step)};
  setTimeout(()=>requestAnimationFrame(step),250);
}
function legendHTML(raw,weak){
  const {eff,cap}=effective(raw);
  return `<div class="legend">${LAYERS.map(l=>`<div class="lg"><span class="sw" style="background:var(--l-${l})"></span>
    <span class="nm">${t(LAYER[l])} ${l===weak?`<span class="chip warn">${u('weakest')}</span>`:''}</span><span class="val">${eff[l]}</span>
    <span class="bar"><i style="width:${eff[l]}%;background:var(--l-${l})"></i></span>${cap[l]?`<span class="note">${u('capped')}${raw[l]}</span>`:''}</div>`).join('')}</div>`;
}
function brandMark(){
  const p=rs=>rs.map((r,i)=>{const a=-Math.PI/2+i*2*Math.PI/5;return `${(11+r*Math.cos(a)).toFixed(1)},${(11.5+r*Math.sin(a)).toFixed(1)}`}).join(' ');
  return `<svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><polygon points="${p([10,10,10,10,10])}" fill="none" style="stroke:var(--muted)" stroke-width="1"/><polygon points="${p([9,6,8,5,7])}" style="fill:var(--accent)"/></svg>`;
}

const rec=(who,key,v)=>{if(FX&&v)FX.push({who,key,v})};
function syncTrust(){const a=IDS.filter(act);if(a.length)S.g.culture.trust=Math.round(a.reduce((s,id)=>s+S.g.people[id].trust,0)/a.length)}
function dS(id,v){if(!act(id))return;const P=S.g.people[id];if(v>0&&P.trait==='resolute')v=Math.ceil(v/2);const o=P.stress;P.stress=clamp(o+v,0,100);rec(id,'stress',P.stress-o)}
function dT(id,v){if(!act(id))return;const P=S.g.people[id],o=P.trust;P.trust=clamp(o+v,0,100);rec(id,'trust',P.trust-o);syncTrust()}
function allS(v){IDS.filter(act).forEach(id=>{const P=S.g.people[id];P.stress=clamp(P.stress+(v>0&&P.trait==='resolute'?Math.ceil(v/2):v),0,100)});rec('all','stress',v)}
function allT(v){IDS.filter(act).forEach(id=>{const P=S.g.people[id];P.trust=clamp(P.trust+v,0,100)});syncTrust();rec('all','trust',v)}
function dB(v){const o=S.g.boss;S.g.boss=clamp(o+v,0,100);rec(null,'boss',S.g.boss-o)}
function dC(l,v){const o=S.g.culture[l];S.g.culture[l]=clamp(o+v,0,100);rec(null,l,S.g.culture[l]-o)}
function plan(pct){S.g.planMult*=1+pct/100;rec(null,'plan',pct)}
function extra(v){S.g.wk.extra+=v;rec(null,'out',v)}
function due(id,w){if(w>S.g.week&&w<=WEEKS&&!S.g.due.some(d=>d.id===id))S.g.due.push({id,w,from:S.g.week})}
function logE(k,txt){S.g.log.push({w:S.g.week,k,txt})}
const weekPlan=()=>Math.round(100*S.g.planMult);
const usedBlocks=()=>S.g.plan.reduce((s,p)=>s+ACT[p.a].cost,0);
const blocksTotal=()=>BLOCKS+(S.g.week===1?S.g.bonus:0);

function newGame(type){
  const mots=shuffle(Object.keys(MOT));
  const off=S.raw?Math.round((S.raw.trust-45)/2):0;
  const people={};
  IDS.forEach((id,i)=>people[id]={stress:PEOPLE[id].stress,trust:clamp(PEOPLE[id].trust+off,10,80),mot:mots[i],known:false,trait:null,quit:false,skill:0,h:Math.floor(Math.random()*2)});
  const c=S.raw?{...S.raw}:{trust:40,conflict:45,commitment:50,accountability:40,results:55};
  S.g={type,week:1,plan:[],people,culture:c,boss:60,planMult:1,weeks:[],flags:{},due:[],log:[],
    stats:{listen:0,right:0,wrong:0,self:0,protect:0,meet:0,talks:0},queue:[],qi:0,wk:null,res:null,over:null,bonus:S.bonus||0};
  S.bonus=0;S.openP=null;syncTrust();
}

function canAdd(a,p){
  const g=S.g,A=ACT[a];
  if(!A.max&&g.plan.some(x=>x.a===a&&x.p===p))return true;
  if(usedBlocks()+A.cost>blocksTotal())return false;
  if(A.once&&g.plan.some(x=>x.a===a))return false;
  if(A.max&&g.plan.filter(x=>x.a===a).length>=A.max)return false;
  if(A.per&&!act(p))return false;
  return true;
}
function toggle(a,p){
  const g=S.g,i=g.plan.findIndex(x=>x.a===a&&x.p===p&&!ACT[a].max);
  if(i>=0){g.plan.splice(i,1);return}
  if(canAdd(a,p))g.plan.push({a,p:p||null});
}

function startWeek(){
  const g=S.g;
  g.wk={extra:0,sick:{},boost:{},reduce:{},talked:{},ins:[],s0:{},t0:{},c0:{...g.culture},b0:g.boss};
  IDS.forEach(id=>{g.wk.s0[id]=g.people[id].stress;g.wk.t0[id]=g.people[id].trust});
  const q=[];
  // instant actions
  FX=[];const ins=[];
  g.plan.forEach(({a,p})=>{
    const P=p&&g.people[p];
    if(a==='coach'){P.skill+=2;if(P.mot==='growth'){dT(p,6);dS(p,-8);P.known=true;ins.push(NL(p,' nušvito, kai pasiūlei augti. Atrodo, tai jam svarbiausia.',' lit up when you offered growth. That seems to matter most.'))}else dS(p,P.stress>=70?5:-3)}
    if(a==='praise'){if(P.mot==='recognition'){dT(p,8);dS(p,-10);P.known=true;ins.push(NL(p,': pripažinimas veikė stipriai. Tai jam svarbiausia.',': recognition hit home. It’s what matters most.'))}else dT(p,2)}
    if(a==='delegate'){if(P.mot==='autonomy'||P.mot==='growth'){dT(p,6);g.wk.boost[p]=true;if(P.mot==='autonomy')P.known=true}
      if(P.stress>=70){dS(p,15);ins.push(NL(p,' jau buvo perkrautas. Papildoma atsakomybė pakėlė stresą.',' was already overloaded. The extra responsibility pushed stress up.'))}else dS(p,4);dC('accountability',3)}
    if(a==='protect'){allS(-8);dB(-6);g.stats.protect++;ins.push(L('Apsaugojai komandą. Žmonėms lengviau, bet vadovybė pastebėjo.','You shielded the team. People breathe easier, but leadership noticed.'))}
    if(a==='boss'){dB(8)}
    if(a==='self'){extra(10);dC('accountability',-3);g.stats.self++;if(g.stats.self>=2)ins.push(L('Darbą darai pats jau ne pirmą kartą. Komanda pratinasi laukti, kol vadovas išgelbės.','Not the first time you’ve done the work yourself. The team is learning to wait for you to rescue them.'))}
    if(a==='talk')q.push({k:'talk',p,h:g.people[p].h});
    if(a==='meeting'){g.stats.meet++;q.push({k:'meeting',moves:[],harm:g.culture.trust<50})}
  });
  if(FX.length)q.unshift({k:'actions',res:{fx:FX,ins}});
  FX=null;
  g.due.filter(d=>d.w===g.week).forEach(d=>{FX=[];const i=CONS[d.id].fx(g);q.push({k:'cons',id:d.id,from:d.from,res:{fx:FX,ins:i}});logE('bad',CONS[d.id].title);FX=null});
  g.due=g.due.filter(d=>d.w!==g.week);
  q.push({k:'event',w:g.week-1});
  g.queue=q;g.qi=0;
}

function talkRes(it,c){
  const g=S.g,id=it.p,P=g.people[id],m=MOT[P.mot];FX=[];let reply,ins;g.stats.talks++;g.wk.talked[id]=true;
  if(c==='listen'){g.stats.listen++;
    if(P.trust>=30){const was=P.known;P.known=true;reply=m.reveal;dS(id,-10);dT(id,6);
      ins=was?L('Klausytis verta net tada, kai jau žinai atsakymą. Žmogus jaučia, kad jis tau rūpi.','Listening is worth it even when you know the answer. People feel that you care.'):L('Paklausei ir išgirdai. Dabar žinai, kas šį žmogų motyvuoja, ir galėsi tai panaudoti.','You asked and listened. Now you know what drives this person, and you can use it.');
      if(!was)logE('good',NL(id,': atradai motyvaciją klausydamas',': found their motivation by listening'))}
    else{reply=L('Viskas gerai. Tikrai.','Everything’s fine. Really.');dS(id,-5);dT(id,8);
      ins=L('Pasitikėjimas dar per žemas, kad žmogus atsivertų. Bet pats klausimas jį kaupia: kitą kartą bus lengviau.','Trust is still too low for them to open up. But asking builds it: next time will be easier.')}
    if(P.trait&&P.trait!=='resolute'){dS(id,-15);if(P.trust>=50){P.trait=null;ins=NL(id,' atsigauna. Išklausymas padarė daugiau nei bet koks sprendimas.',' is recovering. Being heard did more than any fix could.');logE('good',NL(id,' atsigavo po lūžio',' recovered from breaking'))}}
  }else if(c==='reduce'){dS(id,-25);g.wk.reduce[id]=true;dB(-2);reply=L('Ačiū. Tikrai to reikėjo.','Thank you. I really needed that.');
    ins=L('Mažesnis krūvis šią savaitę sumažins rezultatą, bet apsaugos nuo lūžio.','A lighter load this week costs some output, but protects them from breaking.')}
  else if(c===P.mot){g.stats.right++;P.known=true;dS(id,-15);dT(id,10);g.wk.boost[id]=true;reply=m.yes;
    ins=L('Pataikei. Kai žinai, kas žmogų motyvuoja, net trumpas pokalbis veikia stipriai.','Spot on. When you know what drives someone, even a short conversation goes a long way.')}
  else{g.stats.wrong++;dT(id,-2);reply=L('Ačiū… bet ne apie tai galvojau.','Thanks… but that’s not what I had in mind.');
    ins=L('Nepataikei. Tas pats veiksmas skirtingiems žmonėms veikia skirtingai. Gal verta pirma paklausti?','Missed. The same action works differently on different people. Maybe ask first?')}
  it.res={reply,fx:FX,ins,c};FX=null;
}
function meetRes(it,mv){FX=[];const ins=MEET[mv].fx(S.g);it.moves.push({mv,fx:FX,ins});FX=null;
  if(it.moves.length===2&&S.g.flags.fa){due('fa',S.g.week+2);logE('bad',L('Susirinkime priėmei tylų sutikimą','Accepted silent agreement in a meeting'))}
  if(it.moves.length===2&&S.g.flags.fa===false&&it.moves.some(m=>m.mv==='close'))S.g.due=S.g.due.filter(d=>d.id!=='fa');
  if(it.moves.length===2)S.g.flags.fa=undefined;
}
function eventRes(it,i){FX=[];const r=EVENTS[it.w].opts[i].fx(S.g);it.res={i,fx:FX,ins:r.i};FX=null;logE(r.k||'',r.log)}

function endWeek(){
  const g=S.g,wk=g.wk,ins=wk.ins;let out=0;
  IDS.forEach(id=>{const P=g.people[id];if(P.quit||wk.sick[id])return;
    let m=P.stress<40?1:P.stress<70?0.9:0.75;
    if(P.trait==='resolute')m*=1.15;else if(P.trait)m*=0.55;
    m*=0.85+0.3*P.trust/100;if(wk.boost[id])m*=1.15;if(wk.reduce[id])m*=0.6;
    out+=(PEOPLE[id].base+P.skill)*m});
  out=Math.max(0,Math.round(out+wk.extra));const target=weekPlan();
  g.weeks.push({out,plan:target});
  const bd=out>=target?4:-Math.min(15,Math.round((target-out)/3));FX=[];dB(bd);FX=null;
  if(out<target)ins.push(L('Planas neįvykdytas. Pervargę ir mažai pasitikintys žmonės dirba lėčiau.','Target missed. Exhausted people with little trust work more slowly.'));
  const broken=IDS.filter(id=>act(id)&&g.people[id].trait&&g.people[id].trait!=='resolute').length;
  IDS.forEach(id=>{const P=g.people[id];if(P.quit)return;
    let d=12+(g.flags.overload?5:0)+broken*4-(g.people[id].trait&&g.people[id].trait!=='resolute'?4:0);
    if(P.trait==='resolute')d=Math.ceil(d/2);P.stress=clamp(P.stress+d,0,100)});
  if(broken)ins.push(L('Lūžę žmonės kelia stresą ir kitiems.','Broken people raise everyone else’s stress too.'));
  const events={};
  IDS.forEach(id=>{const P=g.people[id];if(P.quit||P.stress<100)return;
    if(P.trait&&P.trait!=='resolute'){P.quit=true;events[id]='quit';logE('bad',NL(id,' išėjo iš komandos',' left the team'));ins.push(NL(id,' išėjo. Lūžęs žmogus be pagalbos ilgai neišbūna.',' quit. A broken person without support doesn’t stay long.'));return}
    if(!P.trait&&P.trust>=65&&Math.random()<0.4){P.trait='resolute';P.stress=55;events[id]='resolute';logE('good',NL(id,' atlaikė spaudimą ir tapo atsparesnis',' held up under pressure and became resolute'));ins.push(NL(id,' atlaikė, nes tavimi pasitiki.',' held up because they trust you.'));return}
    if(!P.trait){P.trait=shuffle(['cynic','withdrawn','hostile'])[0];P.stress=80;events[id]='broke';logE('bad',NL(id,' lūžo nuo streso',' broke under stress'));ins.push(NL(id,' lūžo. Stresas, kurio niekas nesumažino, pasiekė ribą.',' broke. Stress nobody reduced hit the limit.'))}
    else P.stress=90});
  IDS.forEach(id=>{const P=g.people[id];if(act(id)&&!wk.talked[id]&&P.stress>=70&&!events[id])ins.push(NL(id,`: stresas ${P.stress}. Be dėmesio jis kaupiasi kiekvieną savaitę.`,`: stress at ${P.stress}. Without attention it builds every week.`))});
  syncTrust();
  const quits=IDS.filter(id=>g.people[id].quit).length;
  if(g.boss<=0)g.over='fired';else if(quits>=3)g.over='collapse';
  g.res={out,target,bd,events,ins:ins.slice(0,4)};
}
function ending(){
  const g=S.g;if(g.over)return g.over;
  const tot=g.weeks.reduce((s,w)=>s+w.out,0),pl=g.weeks.reduce((s,w)=>s+w.plan,0),pct=tot/pl;
  const a=IDS.filter(act),avgS=a.reduce((s,id)=>s+g.people[id].stress,0)/Math.max(1,a.length),quits=IDS.length-a.length;
  if(pct>=0.95&&g.culture.trust>=60&&quits===0)return 'great';
  if(pct>=0.95)return (avgS>=65||quits>0)?'burn':'mid';
  if(g.culture.trust>=60)return 'kind';
  return 'mid';
}
function profileLines(){
  const s=S.g.stats,o=[];
  if(s.listen===0)o.push(L('Nė karto nepaklausei, kas žmones motyvuoja. Spėliojai arba neklausei visai.','You never once asked what motivates people. You guessed, or didn’t ask at all.'));
  else o.push(L(`Klausei ${s.listen} k. Tai greičiausias kelias suprasti žmones.`,`You listened ${s.listen} times. It’s the fastest way to understand people.`));
  if(s.wrong>s.right)o.push(L(`Nepataikei ${s.wrong} k., pataikei ${s.right}. Spėti, kas žmogui svarbu, kainuoja pasitikėjimą.`,`You missed ${s.wrong} times and hit ${s.right}. Guessing what matters to people costs trust.`));
  if(s.self>=2)o.push(L(`Darbą darei pats ${s.self} k. Komanda mokosi laukti tavęs.`,`You did the work yourself ${s.self} times. The team learns to wait for you.`));
  if(s.meet===0)o.push(L('Nesurengei nė vieno susirinkimo, todėl komanda neturėjo kur ginčytis ir susitarti.','You held no meetings, so the team had nowhere to argue and agree.'));
  if(s.protect>=2)o.push(L('Dažnai saugojai komandą nuo vadovybės. Rūpestinga, bet vadovybės kantrybė riboto dydžio.','You often shielded the team from leadership. Caring, but leadership’s patience is limited.'));
  return o.slice(0,3);
}
const realTask=()=>S.g&&S.g.stats.listen<2
  ?L('Šią savaitę paklausk dviejų komandos narių: „Kas tau dabar svarbiausia darbe?“ Ir tik klausyk, nieko nesiūlyk.','This week, ask two people on your team: “What matters most to you at work right now?” Then just listen, don’t offer anything.')
  :L('Šią savaitę viename susirinkime pirmas įvardink savo klaidą ar tai, ko nežinai: „Čia aš suklydau“ arba „Nežinau. Kas galėtų padėti?“','This week, in one meeting, be the first to name a mistake of yours or something you don’t know: “I got this wrong” or “I don’t know. Who can help?”');

/* ---------- small components ---------- */
function ringC(id){const P=S.g&&S.g.people[id];if(!P)return 'var(--line)';if(P.quit)return 'var(--line)';return P.stress>=70?'var(--bad)':P.stress>=40?'var(--mark)':'var(--good)'}
function avatar(id,sm){return `<span class="av${sm?' sm':''}" style="--ring:${ringC(id)}" aria-hidden="true">${esc(pn(id)[0])}</span>`}
function traitName(id){const P=S.g.people[id];return P.trait?t(TRAITS[P.trait].n[PEOPLE[id].f?'f':'m']):''}
function metricName(){return S.g.type==='sales'?L('Pardavimai','Sales'):L('Atlikti darbai','Work delivered')}
function unit(){return S.g.type==='sales'?L('tūkst. €','k€'):L('taškų','pts')}
function bar(v,c){return `<span class="track"><i style="width:${clamp(v,0,100)}%;${c?`background:${c}`:''}"></i></span>`}
function stressColor(s){return s>=70?'var(--bad)':s>=40?'var(--mark)':'var(--good)'}
function weekBar(extraTxt){return `<div class="weekbar"><span class="eyebrow">${u('week')} ${S.g.week} ${u('of')} ${WEEKS}</span>${extraTxt?`<span class="count">${extraTxt}</span>`:''}</div>
  <div class="progress"><i style="width:${(S.g.week-1)/WEEKS*100}%"></i></div>`}
function metersHTML(){
  const g=S.g,tot=g.weeks.reduce((s,w)=>s+w.out,0),tq=g.weeks.reduce((s,w)=>s+w.plan,0)+(WEEKS-g.weeks.length)*weekPlan();
  const active=IDS.filter(act).length;
  return `<div class="meters">
    <div class="meter wide"><span class="k">${t(metricName())}</span><span class="v">${tot} <small>/ ${tq} ${t(unit())}</small></span>${bar(tot/tq*100)}</div>
    <div class="meter"><span class="k">${u('boss')}</span><span class="v">${g.boss}</span>${bar(g.boss,g.boss<30?'var(--bad)':null)}</div>
    <div class="meter"><span class="k">${u('team')}</span><span class="v">${active} <small>/ ${IDS.length}</small></span>${bar(active/IDS.length*100,active<4?'var(--bad)':null)}</div>
  </div>`;
}
function mentorHTML(){
  const g=S.g;let m=null;
  const near=IDS.find(id=>act(id)&&g.people[id].stress>=85&&!g.people[id].trait);
  const broken=IDS.find(id=>act(id)&&g.people[id].trait&&g.people[id].trait!=='resolute');
  if(broken)m=NL(broken,' lūžo. Pokalbis, kuriame tik klausaisi, yra vienintelis būdas jį susigrąžinti, kol neišėjo.',' has broken. A conversation where you only listen is the one way to bring them back before they quit.');
  else if(near)m=NL(near,` arti lūžio (stresas ${g.people[near].stress}). Pasiekęs 100 jis lūš.`,` is close to breaking (stress ${g.people[near].stress}). At 100 they break.`);
  else if(g.stats.wrong>=2&&g.stats.listen===0)m=L('Pastebėjau, kad spėlioji, kas žmones motyvuoja. Pabandyk pirma paklausti.','I notice you’re guessing what motivates people. Try asking first.');
  else if(g.boss<=25)m=L('Vadovybės kantrybė senka. Laikas atsiskaityti arba įvykdyti planą.','Leadership’s patience is running out. Time to report in or hit the target.');
  return m?`<div class="mentor"><div class="stack tight"><span class="eyebrow">${u('mentor')}</span><p>${t(m)}</p></div></div>`:'';
}
function fxHTML(list){
  if(!list||!list.length)return '';
  const merged=[];list.forEach(f=>{const e=merged.find(x=>x.who===f.who&&x.key===f.key);if(e)e.v+=f.v;else merged.push({...f})});
  const lab=f=>{const k=f.key;let n=k==='stress'?L('stresas','stress'):k==='trust'?L('pasitikėjimas tavimi','trust in you'):k==='boss'?UI.boss:k==='plan'?L('planas','target'):k==='out'?metricName():LAYER[k];
    return (f.who==='all'?u('allTeam')+' · ':f.who?pn(f.who)+' · ':'')+t(n)};
  return `<div class="deltas">${merged.filter(f=>f.v).map(f=>{const bad=(f.key==='stress'||f.key==='plan')?f.v>0:f.v<0;
    return `<div class="delta"><span>${esc(lab(f))}</span><b class="${bad?'neg':''}">${f.v>0?'+':'−'}${Math.abs(f.v)}${f.key==='plan'?' %':''}</b></div>`}).join('')}</div>`;
}
const insight=(i,label)=>i?`<div class="insight"><span class="eyebrow">${label||u('why')}</span><p>${t(i)}</p></div>`:'';
const say=(id,line)=>`<div class="say">${avatar(id,true)}<div class="bubble"><span class="n">${esc(pn(id))}</span>${esc(tx(line))}</div></div>`;

function actBtn(a,p){
  const on=S.g.plan.some(x=>x.a===a&&x.p===p),A=ACT[a],dis=A.max?!canAdd(a,p):(!on&&!canAdd(a,p));
  const cnt=A.max?S.g.plan.filter(x=>x.a===a).length:0;
  return `<button class="act${on||cnt?' on':''}" data-add="${a}" data-p="${p||''}" ${dis?'disabled':''}><b>${t(A.n)}${cnt>1?` ×${cnt}`:''}</b><span>${t(A.d)}</span><span class="cost">${A.cost} ${A.cost>1?u('blocks'):u('block')}</span></button>`;
}
function personCard(id){
  const g=S.g,P=g.people[id],open=S.openP===id;
  const chips=[];
  if(P.quit)chips.push(`<span class="chip bad">${u('gone')}</span>`);
  else{if(P.trait)chips.push(`<span class="chip ${P.trait==='resolute'?'good':'bad'}">${traitName(id)}</span>`);
    chips.push(`<span class="chip">${P.known?t(MOT[P.mot].n):u('motive')+': ?'}</span>`)}
  const planned=g.plan.filter(x=>x.p===id).map(x=>t(ACT[x.a].n));
  return `<div class="pc${open?' open':''}${P.quit?' gone':''}">
    <button class="pc-head" data-open="${id}" ${P.quit?'disabled':''} aria-expanded="${open}">${avatar(id)}
      <span class="pc-id"><span class="who">${esc(pn(id))}</span><span class="role">${tx(PEOPLE[id].role)}</span></span>
      <span class="chips">${chips.join('')}</span></button>
    ${P.quit?'':`<div class="pc-bars">
      <div class="mini"><span class="k"><span>${u('stress')}</span><span>${P.stress}</span></span>${bar(P.stress,stressColor(P.stress))}</div>
      <div class="mini"><span class="k"><span>${u('trustYou')}</span><span>${P.trust}</span></span>${bar(P.trust)}</div>
    </div>`}
    ${planned.length&&!open?`<div class="pc-plan">${planned.map(esc).join(' · ')}</div>`:''}
    ${open?`<div class="pc-acts">${['talk','coach','praise','delegate'].map(a=>actBtn(a,id)).join('')}</div>`:''}
  </div>`;
}
function slotsHTML(){
  const g=S.g,rows=g.plan.map((x,i)=>`<div class="slot full"><span>${t(ACT[x.a].n)}${x.p?` · <b>${esc(pn(x.p))}</b>`:''} <span class="count">${ACT[x.a].cost}</span></span><button class="x" data-rm="${i}" aria-label="×">×</button></div>`);
  for(let i=usedBlocks();i<blocksTotal();i++)rows.push(`<div class="slot">${u('emptySlot')}</div>`);
  return rows.join('');
}

  return `${check}<div class="pyr">${radarSVG(demo)}</div>
  <div class="stack"><h1>${u('tagline')}</h1><p class="lead">${u('intro')}</p></div>
  <ul class="features"><li><b>${u('fl1')}</b><span>${u('f1')}</span></li><li><b>${u('fl2')}</b><span>${u('f2')}</span></li><li><b>${u('fl3')}</b><span>${u('f3')}</span></li></ul>
  <div class="stack tight">
    ${inGame?`<button class="btn" data-act="resume">${u('cont')}</button>`:''}
    <button class="btn ${inGame?'ghost':''}" data-act="startTest">${u('startTest')}</button>
    <button class="link" data-go="setup">${u('skipTest')}</button>
  </div><p class="foot">${u('basis')}</p>`;
};
V.test=()=>{
  const q=Q[S.qi],total=Q.length,a=S.answers[q.id],sec={you:u('secYou'),team:u('secTeam'),style:u('secStyle')}[q.sec];
  const body=q.layer?`<p class="small">${u('teamHint')}</p><div class="likert" role="group">${[1,2,3,4,5].map(v=>`<button data-ans="${v}" aria-pressed="${a===v}">${v}</button>`).join('')}</div>
    <div class="likert-labels"><span>${u('lk1')}</span><span>${u('lk5')}</span></div>`
    :`<div class="stack tight">${q.opts.map((o,i)=>{const v=o.v??i;return `<button class="opt" data-ans="${v}" aria-pressed="${a===v}">${esc(t(o))}</button>`}).join('')}</div>`;
  return `<div class="stack tight"><div class="qhead"><button class="back" data-act="qback">${u('back')}</button><span class="count">${S.qi+1} / ${total}</span></div>
    <div class="progress"><i style="width:${S.qi/total*100}%"></i></div></div><p class="eyebrow">${sec}</p><p class="qtext">${esc(t(q.text))}</p>${body}`;
};
V.result=()=>{
  const weak=weakestLayer(S.raw),st=STYLES[S.style];
  return `<div class="stack tight"><p class="eyebrow">${u('resultEy')}</p><h2>${u('resultH')}</h2></div>
  <div class="pyr" id="pyr">${radarSVG(S.raw,{weak,from:ZERO})}</div><p class="small">${u('resultLead')}</p>${legendHTML(S.raw,weak)}
  <div class="card"><p class="eyebrow">${u('weakest')}: ${t(LAYER[weak])}</p><p>${t(LAYER[weak].weak)}</p></div>
  <div class="card style-card"><p class="eyebrow">${u('styleEy')}</p><span class="sn">${t(st.name)}</span><p>${t(st.desc)}</p></div>
  <p class="small">${u('resultNext')}</p><button class="btn" data-go="setup">${u('toSetup')}</button>`;
};
V.setup=()=>`<div class="stack tight"><p class="eyebrow">${u('setupEy')}</p><h2>${u('setupH')}</h2></div>
  <div class="stack tight">
    <button class="opt type" data-type="sales"><b>${u('sales')}</b><span>${u('salesD')}</span></button>
    <button class="opt type" data-type="project"><b>${u('project')}</b><span>${u('projectD')}</span></button>
  </div>`;
V.intro=()=>`<div class="stack tight"><p class="eyebrow">${u('introEy')}</p><h2>${u('introH')}</h2></div>
  <div class="people">${IDS.map(id=>`<div class="person">${avatar(id)}<div><div class="who">${esc(pn(id))} <span class="role">· ${tx(PEOPLE[id].role)}</span></div></div></div>`).join('')}</div>
  <ul class="features">${['r1','r2','r3','r4','r5'].map((k,i)=>`<li><b>${String(i+1).padStart(2,'0')}</b><span>${u(k)}</span></li>`).join('')}</ul>
  <button class="btn" data-act="toHub">${u('startQ')}</button>`;
V.hub=()=>{
  const used=usedBlocks(),tot=blocksTotal();
  return `${weekBar(`${used} / ${tot} ${u('blocks')}`)}${metersHTML()}${mentorHTML()}
  <div class="stack tight"><p class="eyebrow">${u('yourTeam')}</p><p class="small">${u('tapPerson')}</p></div>
  <div class="pcs">${IDS.map(personCard).join('')}</div>
  <p class="eyebrow">${u('wholeTeam')}</p>
  <div class="team-acts">${['meeting','protect','boss','self'].map(a=>actBtn(a,null)).join('')}</div>
  <div class="stack tight"><p class="eyebrow">${u('weekPlan')}</p><div class="slots">${slotsHTML()}</div></div>
  <div class="dock"><button class="btn" data-act="startWeek">${u('startWeek')} · ${used}/${tot}</button></div>`;
};
V.scene=()=>{
  const g=S.g,it=g.queue[g.qi],head=weekBar(`${g.qi+1} / ${g.queue.length}`);
  const nextBtn=`<button class="btn" data-act="nextItem">${u('next')}</button>`;
  if(it.k==='actions')return `${head}<div class="stack tight"><p class="eyebrow">${u('actionsEy')}</p><h2>${u('actionsH')}</h2></div>${fxHTML(it.res.fx)}
    ${it.res.ins.map(i=>insight(i)).join('')}${nextBtn}`;
  if(it.k==='cons'){const C=CONS[it.id];return `${head}<div class="stack tight"><p class="eyebrow">${u('consEy')} ${it.from}</p><h2>${tx(C.title)}</h2></div>
    <p class="scene">${tx(C.text)}</p>${fxHTML(it.res.fx)}${insight(it.res.ins)}${nextBtn}`}
  if(it.k==='talk'){const id=it.p,P=g.people[id],m=MOT[P.mot];
    const open=P.trait?TRAITS[P.trait].line:P.stress>=70?L('Atvirai? Jėgų beveik nebeliko.','Honestly? I’m nearly out of energy.'):P.trust<30?L('(atsargiai) Tai apie ką norėjai pasikalbėti?','(guarded) So what did you want to talk about?'):null;
    let body;
    if(!it.res){body=`<button class="opt listen" data-talk="listen">${u('listen')}</button><p class="small">${u('orOffer')}</p>
      <div class="levers">${Object.keys(MOT).map(k=>`<button class="opt" data-talk="${k}">${tx(MOT[k].lever)}${P.known&&P.mot===k?` <span class="chip good">${u('knownTag')}</span>`:''}</button>`).join('')}</div>
      ${P.stress>=70?`<button class="opt" data-talk="reduce">${u('reduce')}</button>`:''}`}
    else body=`${say(id,it.res.reply)}${fxHTML(it.res.fx)}${insight(it.res.ins)}${nextBtn}`;
    return `${head}<div class="stack tight"><p class="eyebrow">${u('talkEy')}</p>
      <div class="person solo">${avatar(id)}<div><div class="who">${esc(pn(id))} <span class="role">· ${tx(PEOPLE[id].role)}</span></div>
      <div class="pc-bars inline"><div class="mini"><span class="k"><span>${u('stress')}</span><span>${P.stress}</span></span>${bar(P.stress,stressColor(P.stress))}</div>
      <div class="mini"><span class="k"><span>${u('trustYou')}</span><span>${P.trust}</span></span>${bar(P.trust)}</div></div></div></div></div>
      ${open?say(id,open):''}${say(id,m.hints[it.h])}${body}`}
  if(it.k==='meeting'){
    const intro=it.harm?`<p class="picked">${u('harmonyLow')}</p>${say('marius',L('Viskas gerai, sutinku.','All good, I agree.'))}${say('lina',L('(tyli)','(silent)'))}`
      :`<p class="picked">${u('harmonyOk')}</p>${say('tomas',L('Siūlau kitaip, ir štai kodėl…','I’d do it differently, and here’s why…'))}${say('lina',L('Nesutinku. Žiūrėk į skaičius.','I disagree. Look at the numbers.'))}`;
    const done=it.moves.map(m=>`<div class="stack tight"><p class="eyebrow">${u('meetEy')} · ${t(MEET[m.mv].n)}</p>${MEET[m.mv].r.filter(([id])=>act(id)).map(([id,l])=>say(id,l)).join('')}${fxHTML(m.fx)}${insight(m.ins)}</div>`).join('');
    const left=2-it.moves.length;
    const opts=left?`<p class="small">${u('meetPick')}${left}</p><div class="stack tight">${Object.keys(MEET).filter(k=>!it.moves.some(m=>m.mv===k)).map(k=>`<button class="opt" data-meet="${k}">${t(MEET[k].n)}</button>`).join('')}</div>`:nextBtn;
    return `${head}<div class="stack tight"><p class="eyebrow">${u('meetEy')}</p></div>${intro}${done}${opts}`}
  if(it.k==='event'){const E=EVENTS[it.w],pre=E.pre?E.pre(g):null;
    return `${head}<div class="stack tight"><p class="eyebrow">${u('eventEy')}</p><h2>${tx(E.title)}</h2></div>
      <p class="scene">${tx(E.text)}</p>${pre?`<p class="picked">${t(pre)}</p>`:''}
      ${it.res?`<p class="small">${tx(E.opts[it.res.i].n)}</p>${fxHTML(it.res.fx)}${insight(it.res.ins)}${nextBtn}`
        :`<div class="stack tight">${E.opts.map((o,i)=>`<button class="opt" data-ev="${i}">${tx(o.n)}</button>`).join('')}</div>`}`}
};
V.report=()=>{
  const g=S.g,r=g.res,last=g.over||g.week>=WEEKS;
  return `${weekBar()}<div class="stack tight"><p class="eyebrow">${u('week')} ${g.week} · ${u('reportEy')}</p><h2>${r.out>=r.target?u('hit'):u('miss')}</h2></div>
  <div class="meters"><div class="meter wide"><span class="k">${t(metricName())} · ${u('thisWeek')}</span><span class="v">${r.out} <small>/ ${r.target} ${t(unit())}</small></span>${bar(r.out/r.target*100,r.out<r.target?'var(--bad)':null)}</div>
    <div class="meter"><span class="k">${u('boss')}</span><span class="v">${g.boss} <small>${g.boss-g.wk.b0>=0?'+':'−'}${Math.abs(g.boss-g.wk.b0)}</small></span>${bar(g.boss)}</div>
    <div class="meter"><span class="k">${u('team')}</span><span class="v">${IDS.filter(act).length} <small>/ ${IDS.length}</small></span>${bar(IDS.filter(act).length/IDS.length*100)}</div></div>
  <div class="rows">${IDS.map(id=>{const P=g.people[id],ev=r.events[id],s0=g.wk.s0[id];
    const st=P.quit?`<span class="chip bad">${u('gone')}</span>`:`<span class="small">${u('stress')}</span> ${s0}→${P.stress}`;
    return `<div class="prow">${avatar(id,true)}<div><div class="who">${esc(pn(id))} ${ev==='broke'?`<span class="chip bad">${traitName(id)}</span>`:ev==='resolute'?`<span class="chip good">${traitName(id)}</span>`:''}</div>
      <span class="small">${u('trustYou')} ${P.trust}</span></div><span class="st" style="color:${P.quit?'inherit':stressColor(P.stress)}">${st}</span></div>`}).join('')}</div>
  ${r.ins.length?`<div class="stack tight"><p class="eyebrow">${u('happened')}</p><ul class="bul">${r.ins.map(i=>`<li>${t(i)}</li>`).join('')}</ul></div>`:''}
  <div class="stack tight"><p class="eyebrow">${u('culture')}</p><div class="pyr" id="pyr">${radarSVG(g.culture,{from:g.wk.c0,ghost:g.wk.c0})}</div></div>
  <button class="btn" data-act="afterReport">${last?u('toReview'):u('nextWeek')}</button>`;
};
V.end=()=>{
  const g=S.g,e=ENDINGS[ending()],tot=g.weeks.reduce((s,w)=>s+w.out,0),pl=g.weeks.reduce((s,w)=>s+w.plan,0),quits=IDS.filter(id=>g.people[id].quit).length;
  const committed=S.commitment&&S.commitment.game===g.id;
  return `<div class="stack tight"><p class="eyebrow">${g.over?u('endFail'):u('endEy')}</p><h1>${t(e.t)}</h1><p class="lead">${t(e.d)}</p></div>
  <div class="meters"><div class="meter wide"><span class="k">${t(metricName())}</span><span class="v">${tot} <small>/ ${pl} ${t(unit())}</small></span>${bar(tot/pl*100)}</div>
    <div class="meter"><span class="k">${u('boss')}</span><span class="v">${g.boss}</span>${bar(g.boss)}</div>
    <div class="meter"><span class="k">${u('left')}</span><span class="v">${quits} <small>/ ${IDS.length}</small></span>${bar(quits/IDS.length*100,'var(--bad)')}</div></div>
  <div class="pyr" id="pyr">${radarSVG(g.culture,{ghost:g.c0})}</div>
  <div class="stack tight"><p class="eyebrow">${u('turning')}</p><ul class="timeline">${g.log.map(x=>`<li class="${x.k}"><span class="w">${u('week')} ${x.w}</span><span>${tx(x.txt)}</span></li>`).join('')}</ul></div>
  <div class="stack tight"><p class="eyebrow">${u('profile')}</p><ul class="bul">${profileLines().map(i=>`<li>${t(i)}</li>`).join('')}</ul></div>
  <div class="task"><p class="eyebrow">${u('taskEy')}</p><q>${t(realTask())}</q>${committed?`<p class="small"><b>${u('committed')}</b></p>`:`<button class="btn" data-act="commit">${u('commit')}</button>`}</div>
  <div class="stack tight"><button class="btn ghost" data-act="replay">${u('replay')}</button><p class="small">${u('replayNote')}</p><button class="link" data-go="setup">${u('newTeam')}</button></div>`;
};

/* ---------- desktop side panel ---------- */
const ZERO=Object.fromEntries(LAYERS.map(l=>[l,0]));
const GAME=['intro','hub','scene','report','end'];
function sidePanel(){
  const sc=S.screen;
  if(S.g&&GAME.includes(sc)){
    const g=S.g;
    return `<p class="eyebrow">${u('culture')}</p><div class="pyr" id="pyr-side">${radarSVG(g.culture,sc==='report'?{from:g.wk.c0,ghost:g.wk.c0}:{})}</div>
      <p class="eyebrow">${u('sideLive')}</p><div class="rows">${IDS.map(id=>{const P=g.people[id];return `<div class="prow">${avatar(id,true)}<div><div class="who">${esc(pn(id))}${P.trait?` <span class="chip ${P.trait==='resolute'?'good':'bad'}">${traitName(id)}</span>`:''}</div>
        <span class="small">${P.quit?u('gone'):(P.known?t(MOT[P.mot].n):u('motive')+': ?')}</span></div>${P.quit?'':`<span class="st" style="color:${stressColor(P.stress)}">${P.stress}</span>`}</div>`}).join('')}</div>`;
  }
  if(S.raw&&sc==='result')return `<p class="eyebrow">${u('sideMine')}</p><div class="pyr" id="pyr-side">${radarSVG(S.raw,{weak:weakestLayer(S.raw),from:ZERO})}</div>`;
  const demo={trust:38,conflict:52,commitment:61,accountability:44,results:70};
  return `<p class="eyebrow">${u('sideDemo')}</p><div class="pyr">${radarSVG(demo)}</div>
    <div class="legend">${LAYERS.map(l=>`<div class="lg"><span class="sw" style="background:var(--l-${l})"></span><span class="nm">${t(LAYER[l])}</span><span></span><span class="note">${t(LAYER[l].weak)}</span></div>`).join('')}</div>`;
}

/* ---------- render & events ---------- */
const app=document.getElementById('app');
function render(scrollTop=true){
  document.documentElement.lang=S.lang;
  app.innerHTML=`<header class="top"><button class="brand" data-act="home">${brandMark()}<span>Groundwork</span></button>
    <div class="lang" role="group" aria-label="Kalba / Language"><button data-lang="lt" aria-pressed="${S.lang==='lt'}">LT</button><button data-lang="en" aria-pressed="${S.lang==='en'}">EN</button></div></header>
    <div class="shell"><main>${V[S.screen]()}</main><aside class="side">${sidePanel()}</aside></div>`;
  const from=S.screen==='result'?ZERO:S.screen==='report'?S.g.wk.c0:null;
  if(from){animateRadar(app.querySelector('#pyr'),from);animateRadar(app.querySelector('#pyr-side'),from)}
  if(scrollTop)window.scrollTo(0,0);
  save();
}
function go(s){S.screen=s;render()}

app.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;const d=b.dataset;
  if(d.lang){S.lang=d.lang;render(false);return}
  if(d.go){go(d.go);return}
  if(d.ans!==undefined){const q=Q[S.qi];S.answers[q.id]=+d.ans;
    b.parentElement.querySelectorAll('[aria-pressed]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    setTimeout(()=>{if(S.qi<Q.length-1){S.qi++;render()}else{computeProfile();go('result')}},180);return}
  if(d.type){newGame(d.type);S.g.id=Date.now();S.g.c0={...S.g.culture};go('intro');return}
  if(d.open){S.openP=S.openP===d.open?null:d.open;render(false);return}
  if(d.add){toggle(d.add,d.p||null);render(false);return}
  if(d.rm!==undefined){S.g.plan.splice(+d.rm,1);render(false);return}
  if(d.talk){talkRes(S.g.queue[S.g.qi],d.talk);render(false);return}
  if(d.meet){meetRes(S.g.queue[S.g.qi],d.meet);render(false);return}
  if(d.ev!==undefined){eventRes(S.g.queue[S.g.qi],+d.ev);render(false);return}
  if(d.ck){S.checkin=d.ck;if(d.ck==='yes')S.bonus=1;render(false);return}
  switch(d.act){
    case 'home':go('welcome');break;
    case 'resume':go(S.g.done?'end':S.g.queue.length?'scene':S.g.reported?'report':'hub');break;
    case 'startTest':S.qi=0;S.answers={};go('test');break;
    case 'qback':if(S.qi>0){S.qi--;render()}else go('welcome');break;
    case 'toHub':go('hub');break;
    case 'startWeek':S.openP=null;startWeek();go('scene');break;
    case 'nextItem':S.g.qi++;if(S.g.qi>=S.g.queue.length){S.g.queue=[];endWeek();S.g.reported=true;go('report')}else go('scene');break;
    case 'afterReport':
      if(S.g.over||S.g.week>=WEEKS){S.g.done=true;go('end')}
      else{S.g.reported=false;S.g.week++;S.g.plan=[];S.g.flags.overload=S.g.flags.overload&&S.g.week<=3;go('hub')}
      break;
    case 'commit':S.commitment={date:today(),game:S.g.id,task:realTask()};S.checkin=null;render(false);break;
    case 'replay':{const ty=S.g.type;newGame(ty);S.g.id=Date.now();S.g.c0={...S.g.culture};go('intro');break}
  }
});

function boot(){
  load();
  if(!V[S.screen])S.screen='welcome';
  if(['result'].includes(S.screen)&&!S.raw)S.screen='welcome';
  if(GAME.includes(S.screen)&&!S.g)S.screen='welcome';
  if(S.screen==='scene'&&!(S.g.queue&&S.g.queue[S.g.qi]))S.screen='hub';
  if(S.screen==='report'&&!S.g.res)S.screen='hub';
  render();
}
boot();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>

</body>
