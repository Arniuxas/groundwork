<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groundwork</title>
<meta name="description" content="Groundwork – vadovavimo žaidimas. Vadovauk komandai biure ir pamatyk pasekmes.">
<meta name="theme-color" content="#0D1217">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the office canvas is the stage; a slim HUD sits above it, sheets slide up from the bottom, desktop adds a team sidebar */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0D1217; --surface:#151C23; --raised:#1B242D; --ink:#E7EBEE; --muted:#97A2AD; --line:#26303A; --tint:#1B242D;
  --accent:#C9D7E8; --accent-ink:#0D1217; --focus:#8DB2DE;
  --good:#6CC29C; --bad:#E08A80; --mark:#D2B06E;
  --l-trust:#A3C0E2; --l-conflict:#84A6CF; --l-commitment:#688CB6; --l-accountability:#52739A; --l-results:#415C7C;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}

.app{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));padding-block:8px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:600 19px/1 var(--f-display);background:none;border:0;padding:4px 0;cursor:pointer}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;font:500 11px/1 var(--f-mono);letter-spacing:.08em;padding:7px 9px;border-radius:6px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.game{display:flex;flex-direction:column;gap:8px;min-width:0}
.hud{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.clock{display:flex;flex-direction:column;line-height:1.15}
.clock b{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.clock span{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gauge{display:flex;flex-direction:column;gap:4px;min-width:0}
.gauge .k{display:flex;justify-content:space-between;gap:6px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;min-width:0}
.gauge .k span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gauge .k b{color:var(--ink);font-weight:600;flex:none}
@media (max-width:480px){.hud{grid-template-columns:auto 1fr auto;gap:10px}.hud .gauge:nth-of-type(3){grid-column:2}.hud .hud-btns{grid-row:1 / span 2;grid-column:3}}
.track{display:block;height:4px;background:var(--tint);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.hud-btns{display:flex;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 9px;font:600 12px var(--f-mono);cursor:pointer;min-width:38px}
.ibtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.canvas-wrap{position:relative;align-self:center;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#141A20;touch-action:manipulation}
canvas{display:block;cursor:pointer}
.toast{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:rgba(13,18,23,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;animation:tin .25s ease both;backdrop-filter:blur(4px)}
.toast div.m{border-color:var(--mark)}
.toast div.m b{color:var(--mark)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.mobile-team{display:flex;gap:8px}
.mobile-team .ibtn{flex:1;padding:10px;font-size:12.5px}

.goals-m{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.goals{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.goals li{display:grid;grid-template-columns:18px 1fr;gap:8px;align-items:start;color:var(--ink)}
.goals .box{width:16px;height:16px;border:1px solid var(--muted);border-radius:4px;display:grid;place-items:center;font:600 11px var(--f-mono);margin-top:2px}
.goals li.done{color:var(--muted)}
.goals li.done .box{background:var(--good);border-color:var(--good);color:#0D1217}
.goals li.done span:last-child{text-decoration:line-through}
.side{display:none}
.side .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}

.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .who{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .st{font:600 13px var(--f-mono);text-align:right}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f-display);color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring,var(--line));flex:none}
.av.lg{width:46px;height:46px;font-size:20px}
.chip{display:inline-flex;align-items:center;font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--mark);color:var(--mark)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:220px;overflow:auto}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.log .w{font:500 10.5px var(--f-mono);color:var(--muted);padding-top:2px}
.log li.bad .w{color:var(--bad)} .log li.good .w{color:var(--good)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,11,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:18px max(18px, env(safe-area-inset-left,0px)) 22px max(18px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:25px}
.sheet .lead{font:400 18px/1.45 var(--f-display)}
.who-head{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center}
.who-head .n{font-weight:600;font-size:16px}
.who-head .r{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:flex;flex-direction:column;gap:5px}
.mini .k{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.say{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.bubble{background:var(--raised);border-radius:2px 12px 12px 12px;padding:9px 13px;font-size:14.5px;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.4;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt:hover{border-color:var(--muted)}
.opt.main{border-color:var(--accent)}
.opt .cost{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.btn{appearance:none;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 15px/1.2 var(--f-body);padding:14px 18px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.deltas{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.delta{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.delta b{font:600 13.5px var(--f-mono);color:var(--good)}
.delta b.neg{color:var(--bad)}
.insight{background:var(--raised);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.insight p{font:400 16.5px/1.5 var(--f-display)}
.quote{font:italic 400 18px/1.45 var(--f-display)}

/* full overlays */
.over{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.over-in{max-width:620px;margin:0 auto;padding:28px max(20px, env(safe-area-inset-left,0px)) 40px max(20px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.over h1{font-size:40px}
.over .lead{font-size:16.5px;color:var(--muted)}
.hero-canvas{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.typebtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px}
.typebtn b{font:500 21px var(--f-display)}
.typebtn span{color:var(--muted);font-size:14px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.meter.wide{grid-column:1 / -1}
.meter .k{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:600 19px var(--f-mono)}
.meter .v small{font-size:12px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline .w{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.timeline li.bad .w{color:var(--bad)} .timeline li.good .w{color:var(--good)}
.task{border:1px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.task q{font:400 19px/1.4 var(--f-display);quotes:none}
.link{background:none;border:0;padding:4px 0;color:var(--ink);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted);align-self:flex-start}

/* progression: capital, upgrades, dossiers */
.ibtn.cap{color:var(--mark);border-color:rgba(210,176,110,.5)}
.ibtn:disabled{opacity:.45;cursor:default}
.cap{color:var(--mark)}
.upgs{display:flex;flex-direction:column;gap:8px}
.upg{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--raised);border:1px solid var(--line);border-radius:12px}
.upg b{display:block;font-weight:600;font-size:14.5px}
.upg.own{background:transparent}
.upg .ibtn{padding:9px 12px;color:var(--mark);border-color:var(--mark)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--mark)}
.facts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.fact{display:grid;grid-template-columns:24px 1fr;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.fact .n{font:500 11px var(--f-mono);color:var(--muted);padding-top:3px}
.fact.lock{color:var(--muted)}
.fact.key span:last-child{font:italic 400 16.5px/1.45 var(--f-display)}
.dosrow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;cursor:pointer}
.dosrow b{font-weight:600;font-size:14px}
@media (max-width:480px){.hud-btns{flex-direction:column}}
.cgroup{border-bottom:1px solid var(--line)}
.cgroup summary{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:12px 0;cursor:pointer;list-style:none;font-weight:600;font-size:14.5px}
.cgroup summary::-webkit-details-marker{display:none}
.cgroup summary .small{font:500 11px var(--f-mono);letter-spacing:.06em;white-space:nowrap}
.cards{display:flex;flex-direction:column;gap:8px;padding-bottom:14px}
.icard{background:var(--raised);border:1px solid var(--line);border-left:3px solid var(--muted);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.icard.good{border-left-color:var(--good)} .icard.bad{border-left-color:var(--bad)}
.icard.lock{background:transparent;border-style:dashed;border-left-style:dashed;color:var(--muted)}
.icard b{font-size:13.5px;font-weight:600}
.icard p{font:400 15.5px/1.45 var(--f-display)}
.icard.lock p{font:400 13px/1.4 var(--f-body)}
.stars{font-size:30px;letter-spacing:.12em;color:var(--mark);line-height:1}
.stars .off{color:var(--line)}
.typebtn .stars{font-size:15px;margin-left:6px;vertical-align:2px}
.goals li.miss{color:var(--muted)}
.goals li.ok .box{background:var(--good);border-color:var(--good);color:#0D1217}
.goals li.miss .box{border-color:var(--bad);color:var(--bad)}

@media (min-width:960px){
  .stage{grid-template-columns:minmax(0,1fr) 300px}
  .side{display:flex;flex-direction:column;gap:12px;position:sticky;top:10px}
  .mobile-team,.goals-m{display:none}
  .scrim{align-items:center}
  .sheet{border-radius:18px;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><polygon points="11,1.5 20.5,8.4 16.9,19.6 5.1,19.6 1.5,8.4" fill="none" stroke="#97A2AD"/><polygon points="11,2.5 16.7,9.6 13.9,15.4 8,17 4.3,9.3" fill="#C9D7E8"/></svg><span>Groundwork</span></button>
    <div class="lang" role="group" aria-label="Kalba / Language"><button data-lang="lt">LT</button><button data-lang="en">EN</button></div>
  </header>
  <div class="stage">
    <section class="game">
      <div class="hud" id="hud"></div>
      <div class="canvas-wrap"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
      <p class="hint" id="hint"></p>
      <div class="goals-m" id="goalsM"></div>
      <div class="mobile-team"><button class="ibtn" data-ui="team" id="mteam"></button><button class="ibtn" data-ui="log" id="mlog"></button></div>
    </section>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="over" id="over" hidden><div class="over-in" id="overIn"></div></div>

<script>
const L=(lt,en)=>({lt,en});

/* ================= content ================= */
const UI={
  days:[L('Pirmadienis','Monday'),L('Antradienis','Tuesday'),L('Trečiadienis','Wednesday'),L('Ketvirtadienis','Thursday'),L('Penktadienis','Friday')],
  week:L('Savaitė','Week'),boss:L('Vadovybė','Leadership'),team:L('Komanda','Team'),log:L('Įvykiai','Events'),
  tagline:L('Tavo biuras. Tavo komanda. Tavo sprendimai.','Your office. Your team. Your calls.'),
  intro:L('Pradėk nuo trijų žmonių komandos, samdyk naujus ir kilk karjeros laiptais. Žmonės dirba, pavargsta, ginčijasi ir ateina pas tave. Tu sprendi, kam skirti laiką.','Start with a team of three, hire new people and climb the career ladder. People work, get tired, argue and come to you. You decide where your time goes.'),
  choose:L('Pasirink komandą','Choose your team'),
  sales:L('Pardavimų komanda','Sales team'),salesD:L('Planas, klientai, premijos','Targets, clients, bonuses'),
  project:L('Projektų komanda','Project team'),projectD:L('Terminai, klientai, kokybė','Deadlines, clients, quality'),
  cont:L('Tęsti','Continue'),
  basis:L('Paremta Patricko Lencioni komandos disfunkcijų modeliu. Prototipas.','Based on Patrick Lencioni’s model of team dysfunctions. Prototype.'),
  howH:L('Kaip žaisti','How to play'),
  how:[L('Paspausk ant grindų, ir tavo personažas ten nueis.','Tap the floor and your character walks there.'),
       L('Paspausk ant žmogaus, kad pasikalbėtum. Pokalbis užima 20 min.','Tap a person to talk. A conversation takes 20 minutes.'),
       L('Stresą matai virš galvų: debesėlis reiškia, kad žmogui sunku. Pasiekęs 100 jis lūžta.','Stress shows above heads: a cloud means someone is struggling. At 100 they break.'),
       L('Šauktukas reiškia, kad kažkas laukia tavęs. Jei nespėsi, bus pasekmių.','An exclamation mark means someone is waiting for you. If you don’t get there, there are consequences.'),
       L('Paspausk ant susitikimų kambario, kad sušauktum susirinkimą, o ant savo stalo – kad dirbtum ar atsiskaitytum vadovybei.','Tap the meeting room to call a meeting, or your desk to work or report to leadership.'),
       L('Diena trunka apie 10 minučių. Progresas išsaugomas automatiškai: gali uždaryti ir vėliau tęsti.','A day lasts about 10 minutes. Progress saves automatically: close the game and continue later.')],
  go:L('Pradėti pirmadienį','Start Monday'),
  talkDone:L('Šiandien jau kalbėjotės. Rytoj vėl galėsi.','You already talked today. Try again tomorrow.'),
  listen:L('Paklausti ir klausytis: „Kas tau dabar svarbiausia?“','Ask and listen: “What matters most to you right now?”'),
  offer:L('Arba pasiūlyk:','Or offer:'),
  reduce:L('Sumažinti krūvį šiandien','Lighten their load today'),
  close:L('Grįžti į biurą','Back to the office'),
  later:L('Ne dabar','Not now'),
  min:L('min','min'),h:L('val.','h'),
  stress:L('Stresas','Stress'),trust:L('Pasitikėjimas','Trust'),motive:L('Motyvacija','Motivation'),
  allTeam:L('Visa komanda','Whole team'),
  meetH:L('Komandos susirinkimas','Team meeting'),meetAsk:L('Sušaukti visus į susitikimų kambarį? Užtruks 45 min.','Call everyone to the meeting room? It takes 45 min.'),
  meetCall:L('Sušaukti','Call the meeting'),meetDone:L('Šiandien susirinkimas jau buvo.','You already held a meeting today.'),
  meetPick:L('Pasirink ėjimus. Liko: ','Choose your moves. Left: '),
  harmonyLow:L('Visi linksi. Niekas neprieštarauja. Per tylu.','Everyone nods. Nobody disagrees. It’s too quiet.'),

  {title:{sales:L('Skambina vadovybė: premijos','Leadership calls: bonuses'),project:L('Skambina vadovybė: apdovanojimas','Leadership calls: the award')},
   text:{sales:L('„Komandos premiją paskirstyk pats.“ Tomas jau garsiai sako, kad didžioji dalis priklauso jam.','“Split the team bonus yourself.” Tom is already saying loudly that most of it is his.'),

/* weeks 2-5: three dilemmas each, one Lencioni layer per week (indices 5-16) */
EVENTS.push(
  {title:L('Per tylus sutikimas','Too quiet a yes'),
   text:L('Marius: „Vakar susirinkime visi pritarė naujam procesui. Bet koridoriuje girdžiu, kad niekas juo netiki.“','Mark: “Yesterday everyone agreed to the new process in the meeting. But in the corridor I hear nobody believes in it.”'),
   opts:[
    {n:L('Sušaukti visus dar kartą ir paprašyti kiekvieno vieno prieštaravimo','Call everyone again and ask each person for one objection'),fx:g=>{dC('conflict',10);allS(3);
      return {i:L('Konfliktą kartais reikia iškasti. Kai prašai prieštaravimų, jie tampa saugūs, o ne slapti.','Sometimes conflict has to be dug up. When you ask for objections, they become safe instead of secret.'),log:L('Paprašei kiekvieno prieštaravimo','Asked everyone for an objection'),k:'good'}}},
    {n:L('Paprašyti Mariaus įvardinti, kas nesutinka','Ask Mark to name who disagrees'),fx:g=>{dT('marius',-8);allT(-3);dC('conflict',-3);
      return {i:L('Marius tapo informatoriumi. Kiti tai pajus ir kalbės dar mažiau.','Mark became an informer. The others will sense it and say even less.'),log:L('Prašei įvardinti nesutinkančius','Asked for the names of those who disagree'),k:'bad'}}},
    {n:L('Palikti kaip yra: procesas vis tiek bus įdiegtas','Leave it: the process is happening anyway'),fx:g=>{dC('conflict',-6);due('fa',g.day+2);
      return {i:L('Tylus nesutikimas niekur nedingsta. Jis tik persikelia iš susirinkimo į koridorių.','Silent disagreement doesn’t disappear. It just moves from the meeting room to the corridor.'),log:L('Ignoravai tylų nesutikimą','Ignored silent disagreement'),k:'bad'}}},
    {n:L('Pasakyti Mariui: „Ačiū. O ką tu pats manai?“','Tell Mark: “Thanks. And what do you think?”'),fx:g=>{dT('marius',6);dC('conflict',3);
      return {i:L('Marius pasakė savo nuomonę. Tai pradžia, bet kiti vis dar tyli.','Mark gave his own view. It’s a start, but the others are still silent.'),log:L('Paklausei Mariaus nuomonės','Asked Mark for his view'),k:''}}}]},
  {title:L('Tomas ir Lina nesutaria','Tom and Lena disagree'),
   text:L('Tomas nori pirmiausia imtis naujų klientų, Lina – sutvarkyti senas problemas. Abu ateina pas tave atskirai ir prašo palaikymo.','Tom wants to go after new clients first; Lena wants to fix old problems. Each comes to you separately for support.'),
   opts:[
    {n:L('Pasodinti abu prie lentos: kiekvienas pagrindžia skaičiais, tada sprendi tu','Sit both at the whiteboard: each argues with numbers, then you decide'),fx:g=>{dC('conflict',8);dC('commitment',5);dS('tomas',4);dS('lina',4);
      return {i:L('Ginčas dėl faktų, o ne dėl asmenų, duoda geresnį sprendimą. Vadovas sprendžia, kai argumentai išsakyti.','An argument about facts, not people, produces a better decision. The leader decides once the arguments are heard.'),log:L('Ginčą dėl prioritetų išsprendėte prie lentos','Settled the priority dispute at the whiteboard'),k:'good'}}},
    {n:L('Nuspręsti pačiam ir pranešti abiem laišku','Decide yourself and email them both'),fx:g=>{dC('commitment',-5);dT('tomas',-4);dT('lina',-4);
      return {i:L('Greita, bet abu jaučiasi neišklausyti. Sprendimas be diskusijos laikosi silpnai.','Fast, but both feel unheard. A decision without discussion holds weakly.'),log:L('Prioritetus nustatei be diskusijos','Set priorities without discussion'),k:'bad'}}},
    {n:L('Padalinti laiką per pusę, kad niekas nepyktų','Split the time in half so nobody is upset'),fx:g=>{extra(-6);dC('conflict',-3);
      return {i:L('Kompromisas, kuriuo vengiama konflikto, dažnai sujungia blogiausias abiejų variantų puses.','A compromise made to avoid conflict often combines the worst of both options.'),log:L('Konfliktą užglaistei kompromisu','Papered over the conflict with a compromise'),k:''}}},
    {n:L('Palaikyti Tomą, jis atneša daugiausia','Back Tom, he brings in the most'),fx:g=>{dT('lina',-10);dS('lina',8);dC('conflict',-4);
      return {i:L('Lina išmoko, kad ginčą laimi tas, kuris garsesnis ar svarbesnis, o ne tas, kuris teisus.','Lena learned the argument is won by the louder or more important person, not the one who’s right.'),log:L('Ginče palaikei stipresnįjį','Backed the stronger side in a dispute'),k:'bad'}}}]},
  {title:L('Vadovybė klausia vieno žodžio','Leadership wants one word'),
   text:L('„Ar komanda pritaria reorganizacijai? Taip ar ne?“ Tu žinai, kad Lina ir Eglė turi rimtų abejonių.','“Does the team support the reorganisation? Yes or no?” You know Lena and Emma have serious doubts.'),
   opts:[
    {n:L('Pasakyti tiesą: abejonių yra, ir paaiškinti kokių','Tell the truth: there are doubts, and explain them'),fx:g=>{dB(-3);allT(5);dC('conflict',5);
      return {i:L('Sąžiningas atsakymas aukštyn moko komandą, kad tiesa čia saugi.','An honest answer upwards teaches the team that truth is safe here.'),log:L('Vadovybei perdavei komandos abejones','Passed the team’s doubts to leadership'),k:'good'}}},
    {n:L('„Visi pritaria“','“Everyone supports it”'),fx:g=>{dB(6);dT('lina',-6);dT('egle',-6);dC('conflict',-5);
      return {i:L('Vadovybė patenkinta, bet Lina ir Eglė žino, kad jų balsas dingo pakeliui.','Leadership is pleased, but Lena and Emma know their voices got lost on the way.'),log:L('Nuslėpei abejones nuo vadovybės','Hid the doubts from leadership'),k:'bad'}}},
    {n:L('Paprašyti dienos ir pirma surinkti komandos nuomonę','Ask for a day and gather the team’s view first'),fx:g=>{dB(-2);dC('conflict',6);dC('commitment',4);
      return {i:L('Komanda pamatė, kad jos nuomonė keliauja aukštyn, o ne lieka tavo kabinete.','The team saw its view travels upwards instead of staying in your office.'),log:L('Prieš atsakydamas surinkai komandos nuomonę','Gathered the team’s view before answering'),k:'good'}}}]},
  {title:L('Miglotas tikslas','A vague goal'),
   text:L('Vadovybė atsiuntė naują ketvirčio tikslą: „Didinti klientų pasitenkinimą.“ Komanda klausia, ką tai reiškia praktiškai.','Leadership sent a new quarterly goal: “Increase customer satisfaction.” The team asks what that means in practice.'),
   opts:[
    {n:L('Kartu su komanda paversti tikslą 2–3 išmatuojamais darbais','Turn the goal into 2–3 measurable tasks together with the team'),fx:g=>{dC('commitment',10);dC('conflict',3);
      return {i:L('Žmonės įsipareigoja tam, ką supranta ir ką padėjo suformuluoti.','People commit to what they understand and helped to shape.'),log:L('Tikslą su komanda pavertėte konkrečiais darbais','Turned the goal into concrete tasks with the team'),k:'good'}}},
    {n:L('Persiųsti tikslą komandai be komentarų','Forward the goal without comment'),fx:g=>{dC('commitment',-8);allS(4);
      return {i:L('Miglotas tikslas kelia nerimą: kiekvienas jį supranta savaip.','A vague goal creates anxiety: everyone reads it differently.'),log:L('Miglotą tikslą persiuntei be paaiškinimo','Forwarded a vague goal without explanation'),k:'bad'}}},
    {n:L('Pačiam paskirti kiekvienam užduotį','Assign everyone a task yourself'),fx:g=>{dC('commitment',3);dC('conflict',-3);
      return {i:L('Aišku, bet tai tavo planas, ne jų. Įsipareigojimas bus paviršutiniškas.','Clear, but it’s your plan, not theirs. The commitment will be shallow.'),log:L('Užduotis paskirstei pats','Assigned the tasks yourself'),k:''}}}]},
  {title:L('Eglė nežino, ko klausyti','Emma doesn’t know whom to follow'),
   text:L('Eglė: „Tomas sako, kad svarbiausia viena, Lina – kad kita. O tu pirmadienį sakei trečią. Ką man daryti?“','Emma: “Tom says one thing matters most, Lena says another. And on Monday you said a third. What do I do?”'),
   opts:[
    {n:L('Pripažinti neaiškumą ir tą pačią dieną paskelbti visiems vieną prioritetų sąrašą','Own the confusion and publish one priority list for everyone today'),fx:g=>{dC('commitment',8);dS('egle',-10);allT(3);
      return {i:L('Kai prioritetai prieštarauja vieni kitiems, kalta ne komanda, o neaiškumas. Vienas sąrašas visiems jį panaikina.','When priorities contradict each other, the problem is unclarity, not the team. One list for everyone removes it.'),log:L('Paskelbei vieną prioritetų sąrašą','Published one priority list'),k:'good'}}},
    {n:L('Pasakyti Eglei daryti tai, ką sakei tu','Tell Emma to do what you said'),fx:g=>{dS('egle',-4);dT('tomas',-3);dT('lina',-3);
      return {i:L('Eglei aišku, bet kiti nežino, kad jų nurodymai atšaukti.','Emma is clear, but the others don’t know their instructions were overruled.'),log:L('Prioritetus paaiškinai tik Eglei','Clarified priorities for Emma only'),k:''}}},
    {n:L('„Susitark su jais pati“','“Sort it out with them yourself”'),fx:g=>{dS('egle',12);dT('egle',-6);
      return {i:L('Naujokė negali spręsti vyresnių kolegų ginčų. Tai vadovo darbas.','A newcomer can’t settle disputes between senior colleagues. That’s the manager’s job.'),log:L('Prioritetų ginčą palikai naujokei','Left the priority dispute to the newcomer'),k:'bad'}}}]},
  {title:L('Sprendimas, dėl kurio nesutariama','A decision nobody agrees on'),
   text:L('Komanda dvi savaites ginčijasi dėl naujo įrankio: pusė už, pusė prieš. Tomas: „Gal dar savaitę palaukim?“','The team has argued about a new tool for two weeks: half for, half against. Tom: “Maybe we wait another week?”'),
   opts:[
    {n:L('Išklausyti paskutinius argumentus ir nuspręsti šiandien, net jei ne visi sutinka','Hear the last arguments and decide today, even if not everyone agrees'),fx:g=>{dC('commitment',10);dC('conflict',3);dS('tomas',3);
      return {i:L('Įsipareigojimas nereiškia, kad visi sutinka. Žmonės palaiko sprendimą, kai buvo išgirsti ir kai sprendimas aiškus.','Commitment doesn’t require agreement. People back a decision when they’ve been heard and the decision is clear.'),log:L('Nusprendei, nors ne visi sutiko','Decided even though not everyone agreed'),k:'good'}}},
    {n:L('Palaukti dar savaitę','Wait another week'),fx:g=>{dC('commitment',-8);extra(-8);
      return {i:L('Laukimas, kol visi sutiks, yra sprendimas nieko nedaryti. Komanda pavargsta nuo neapibrėžtumo.','Waiting until everyone agrees is a decision to do nothing. The team tires of uncertainty.'),log:L('Sprendimą atidėjai','Postponed the decision'),k:'bad'}}},
    {n:L('Balsuoti: dauguma laimi','Vote: the majority wins'),fx:g=>{dC('commitment',3);allT(-2);
      return {i:L('Balsavimas greitas, bet pralaimėjusieji jaučiasi nugalėti, o ne išgirsti.','A vote is quick, but the losers feel defeated rather than heard.'),log:L('Sprendimą nulėmė balsavimas','Settled it with a vote'),k:''}}}]},
  {title:L('Tomas vėl vėluoja','Tom is late again'),
   text:L('Darius: „Tomas jau trečią kartą laiku nepateikė savo dalies. Mes visi laukiam. Ar tu jam ką nors pasakysi?“','Dan: “Tom has missed his part for the third time. We’re all waiting. Are you going to say something?”'),
   opts:[
    {n:L('Pasikalbėti su Tomu tiesiai: faktai, poveikis komandai, kas toliau','Talk to Tom directly: facts, impact on the team, what next'),fx:g=>{dC('accountability',10);dS('tomas',6);dT('darius',5);
      return {i:L('Atskaitomybė prasideda nuo vadovo, kuris nebijo nepatogaus pokalbio. Kiti stebi, ar taisyklės galioja visiems.','Accountability starts with a leader who isn’t afraid of an awkward conversation. Everyone watches whether the rules apply to all.'),log:L('Su Tomu kalbėjai tiesiai','Spoke to Tom directly'),k:'good'}}},
    {n:L('Nieko nedaryti: Tomas geriausias darbuotojas','Do nothing: Tom is the best performer'),fx:g=>{dC('accountability',-10);allT(-4);
      return {i:L('Kai žvaigždėms galioja kitos taisyklės, komanda nustoja laikytis savųjų.','When stars play by different rules, the team stops keeping its own.'),log:L('Tomo vėlavimą praleidai pro pirštus','Let Tom’s lateness slide'),k:'bad'}}},
    {n:L('Pasiūlyti Dariui pačiam pasakyti Tomui','Suggest Dan tells Tom himself'),fx:g=>{dC('accountability',6);dC('conflict',4);dS('darius',4);
      return {i:L('Stipriose komandose kolegos patys reikalauja vieni iš kitų. Bet be tavo palaikymo tai rizikinga.','In strong teams, peers hold each other to account. But without your backing it’s risky.'),log:L('Paskatinai kolegą kalbėti tiesiai','Encouraged a peer to speak up'),k:''}}},
    {n:L('Padaryti Tomo darbą pačiam','Do Tom’s part yourself'),fx:g=>{extra(6);dC('accountability',-6);
      return {i:L('Terminas išgelbėtas, bet Tomas išmoko, kad terminai jam negalioja.','The deadline is saved, but Tom learned deadlines don’t apply to him.'),log:L('Tomo darbą padarei už jį','Did Tom’s work for him'),k:'bad'}}}]},
  {title:L('Rezultatų lentelė','A results board'),
   text:L('Vadovybė siūlo kabinti viešą kiekvieno darbuotojo rezultatų lentelę su reitingu.','Leadership suggests putting up a public board ranking each person’s results.'),
   opts:[
    {n:L('Vietoj reitingo kabinti komandos tikslų lentą: kas už ką atsakingas','Put up a team goals board instead: who owns what'),fx:g=>{dC('accountability',8);dC('results',5);
      return {i:L('Matomi įsipareigojimai kuria atskaitomybę be gėdinimo.','Visible commitments create accountability without shaming.'),log:L('Įvedei komandos tikslų lentą','Introduced a team goals board'),k:'good'}}},
    {n:L('Įvesti asmeninį reitingą, kaip siūlo vadovybė','Introduce the personal ranking'),fx:g=>{dB(5);dC('results',-6);allS(6);allT(-3);
      return {i:L('Reitingai skatina konkuruoti su kolegomis, o ne su konkurentais.','Rankings make people compete with colleagues instead of competitors.'),log:L('Įvedei asmeninį reitingą','Introduced a personal ranking'),k:'bad'}}},
    {n:L('Atsisakyti: lentelės demotyvuoja','Refuse: boards demotivate'),fx:g=>{dB(-6);dC('accountability',-3);
      return {i:L('Komanda apsaugota, bet niekas nemato, kas už ką atsakingas.','The team is protected, but nobody can see who owns what.'),log:L('Atsisakei rezultatų lentos','Refused the results board'),k:''}}}]},
  {title:L('Lina pripažįsta klaidą','Lena owns a mistake'),
   text:L('Lina prie visų: „Suklydau skaičiavime. Dėl manęs klientas gavo blogą pasiūlymą. Atsiprašau.“','Lena, in front of everyone: “I made a calculation error. Because of me the client got a bad offer. I’m sorry.”'),
   opts:[
    {n:L('Padėkoti už atvirumą ir kartu suplanuoti, kaip ištaisyti','Thank her for being open and plan the fix together'),fx:g=>{dT('lina',8);dC('accountability',6);allT(3);
      return {i:L('Kai prisipažinimas sutinkamas su pagarba, kiti irgi drįs pripažinti savo klaidas.','When an admission is met with respect, others will dare to admit theirs too.'),log:L('Linos prisipažinimą sutikai su pagarba','Met Lena’s admission with respect'),k:'good'}}},
    {n:L('Griežtai pasakyti, kad tai neturi pasikartoti','Say sternly it must not happen again'),fx:g=>{dS('lina',12);dT('lina',-8);dC('accountability',-3);
      return {i:L('Griežtumas už prisipažinimą moko klaidas slėpti.','Being harsh about an admission teaches people to hide mistakes.'),log:L('Griežtai sureagavai į prisipažinimą','Reacted harshly to an admission'),k:'bad'}}},
    {n:L('„Nieko tokio“ ir sutvarkyti pačiam','“No problem” and fix it yourself'),fx:g=>{dT('lina',3);dC('accountability',-4);
      return {i:L('Malonu, bet pamoka neliko, o atsakomybė grįžo tau.','Kind, but no lesson stayed, and the responsibility came back to you.'),log:L('Linos klaidą sutvarkei pats','Fixed Lena’s mistake yourself'),k:''}}}]},
  {title:L('Premija: asmeniniai ar bendri tikslai','Bonus: personal or team goals'),
   text:L('Vadovybė: „Kiekvienam nustatyk asmeninį tikslą. Premija bus tik už jį.“','Leadership: “Set each person an individual target. The bonus will depend only on that.”'),
   opts:[
    {n:L('Pasiūlyti derinį: didesnė dalis premijos už komandos tikslą','Propose a mix: most of the bonus tied to the team goal'),fx:g=>{dB(-2);dC('results',10);
      return {i:L('Kai premija priklauso nuo bendro rezultato, žmonės padeda vieni kitiems.','When the bonus depends on the shared result, people help each other.'),log:L('Premiją susiejai su komandos tikslu','Tied the bonus to the team goal'),k:'good'}}},
    {n:L('Sutikti','Agree'),fx:g=>{dB(6);dC('results',-8);
      return {i:L('Kiekvienas sieks savo skaičiaus, net jei komanda pralaimi.','Everyone will chase their own number, even if the team loses.'),log:L('Įvedei tik asmeninius tikslus','Introduced individual targets only'),k:'bad'}}},
    {n:L('Atsisakyti bet kokių asmeninių tikslų','Refuse any individual targets'),fx:g=>{dB(-8);dC('results',4);dC('accountability',-3);
      return {i:L('Bendras tikslas svarbus, bet be asmeninės atsakomybės kai kas ims slėptis už komandos.','The shared goal matters, but without personal ownership some will hide behind the team.'),log:L('Atsisakei asmeninių tikslų','Refused individual targets'),k:''}}}]},
  {title:L('Tomas nori kliento sau','Tom wants the client for himself'),
   text:L('Tomas: „Šitas didelis klientas mano. Jei jį atiduosi Mariui, išeinu.“ Mariui jis tiktų labiau.','Tom: “This big client is mine. If you give it to Mark, I’m leaving.” It would suit Mark better.'),
   opts:[
    {n:L('Paaiškinti, kodėl klientas atitenka Mariui, ir pasiūlyti Tomui kitą iššūkį','Explain why the client goes to Mark and offer Tom another challenge'),fx:g=>{dC('results',8);dS('tomas',6);dT('tomas',-2);dT('marius',6);
      return {i:L('Komandos rezultatas svarbesnis už ego. Bet verta pripažinti ir tai, kas svarbu Tomui.','The team result matters more than ego. But what matters to Tom deserves recognition too.'),log:L('Klientą skyrei pagal tai, kas geriausia komandai','Assigned the client by what’s best for the team'),k:'good'}}},
    {n:L('Atiduoti Tomui, kad neišeitų','Give it to Tom so he stays'),fx:g=>{dC('results',-6);dT('marius',-8);
      return {i:L('Grasinimas pasiteisino. Kitą kartą juo bus naudojamasi dažniau.','The threat worked. Next time it will be used more often.'),log:L('Nusileidai Tomo grasinimui','Gave in to Tom’s threat'),k:'bad'}}},
    {n:L('Leisti jiems dirbti su klientu kartu','Let them handle the client together'),fx:g=>{dC('results',4);dS('tomas',4);dS('marius',4);dC('conflict',3);
      return {i:L('Gali pavykti, bet neaiški atsakomybė dažnai virsta trintimi.','It might work, but unclear ownership often turns into friction.'),log:L('Klientą padalinai dviem','Split the client between two people'),k:''}}}]},
  {title:L('Paskutinis penktadienis','The final Friday'),
   text:L('Iki savaitės plano trūksta nedaug. Marius siūlo: „Galim šiandien visi dirbti iki vėlumos.“','The weekly target is within reach. Mark suggests: “We could all work late tonight.”'),
   opts:[
    {n:L('Paklausti komandos, kas realu, ir susitarti dėl prioritetų, ne dėl valandų','Ask the team what’s realistic and agree on priorities, not hours'),fx:g=>{extra(8);allS(3);dC('results',5);dC('commitment',3);

  {title:L('Vadovas perdega','The lead is burning out'),

);

  fa:{title:L('Sprendimas sugrįžo','The decision came back'),text:L('Dalis komandos toliau dirba pagal seną planą. Susirinkime visi „sutiko“, bet iš tikrųjų nesutiko.','Part of the team is still working to the old plan. Everyone “agreed” in the meeting, but didn’t really.'),

/* ================= micro-events & daily goals ================= */

const pickOne=a=>a.length?rnd(a):null;
const MICRO={
  star:{icon:'star',pick:()=>pickOne(IDS.filter(i=>ok(i)&&G.people[i].stress<70&&!G.people[i].trait)),title:L('Puikus darbas','Great work'),
    text:a=>L(`${NM(a).lt} ką tik užbaigė sudėtingą užduotį anksčiau termino ir patenkintas atsilošė kėdėje.`,`${NM(a).en} just finished a tough task ahead of schedule and is leaning back, pleased.`),
    opts:[
      {n:L('Pagirti prie visų už konkretų darbą','Praise the specific work in front of everyone'),fx:a=>{RT.cnt.praise++;if(G.people[a].mot==='recognition'){if(!G.people[a].known)RT.cnt.reveal++;G.people[a].known=true;dT(a,10);dS(a,-8);return L('Pataikei: pripažinimas šiam žmogui svarbiausias. Matei, kaip jis nušvito?','Spot on: recognition matters most to this person. Did you see them light up?')}dT(a,4);return L('Pagyrimas veikia, kai jis konkretus ir laiku. Vieniems jis labai svarbus, kitiems mažiau.','Praise works when it’s specific and timely. It matters a lot to some people, less to others.')}},
      {n:L('Padėkoti asmeniškai','Thank them privately'),fx:a=>{RT.cnt.praise++;dT(a,5);dS(a,-4);return L('Asmeninė padėka saugi ir nuoširdi. Kai kuriems ji vertingesnė nei vieša.','A private thank-you is safe and sincere. For some it’s worth more than public praise.')}},
      {n:L('Iškart duoti kitą užduotį','Hand over the next task right away'),fx:a=>{dS(a,8);dT(a,-4);extra(4);return L('Rezultatas auga, bet žmogus išmoko: geras darbas čia atneša tik daugiau darbo.','Output goes up, but the lesson learned is: good work here just earns more work.')}}],
    miss:a=>{dT(a,-3);return L(`${GEN(a).lt} geras darbas liko nepastebėtas`,`${NM(a).en}’s good work went unnoticed`)}},
  q:{icon:'q',pick:()=>ok('egle')&&Math.random()<0.6?'egle':pickOne(IDS.filter(ok).sort((a,b)=>G.people[a].trust-G.people[b].trust).slice(0,2)),title:L('Klausimas','A question'),
    text:a=>L(`${NM(a).lt}: „Nežinau, kaip tai padaryti. Gal gali parodyti?“`,`${NM(a).en}: “I’m not sure how to do this. Could you show me?”`),
    opts:[
      {n:L('Atsisėsti šalia ir padaryti kartu','Sit down and do it together'),cost:30,fx:a=>{dS(a,-8);dT(a,4);return L('Žmogus išmoko ir jaučiasi palaikomas. Bet tai kainavo tavo pusvalandį.','They learned and feel supported. But it cost you half an hour.')}},
      {n:L('Paklausti: „O kaip manai tu?“','Ask: “What do you think?”'),fx:a=>{if(G.people[a].trust>=40){dS(a,-4);dT(a,5);dC('accountability',2);return L('Tu nedavei atsakymo, o padėjai jį rasti. Kitą kartą jis bandys pats.','You didn’t give the answer, you helped them find it. Next time they’ll try on their own.')}
        dS(a,5);return L('Kai pasitikėjimas žemas, toks klausimas atrodo kaip egzaminas. Žmogus pasijuto dar labiau pasimetęs.','When trust is low, that question feels like a test. They feel even more lost.')}},
      {n:a=>{const h=helper(a);return L(`Paprašyti ${GEN(h).lt} padėti`,`Ask ${NM(h).en} to help`)},fx:a=>{const h=helper(a);dS(a,-5);dS(h,4);dC('accountability',3);return L('Komanda mokosi padėti vieni kitiems, o ne viską nešti tau.','The team learns to help each other instead of bringing everything to you.')}}],
    miss:a=>{dS(a,8);return L(`${NM(a).lt} liko įstrigęs su klausimu`,`${NM(a).en} stayed stuck with their question`)}},
  papers:{icon:'papers',pick:()=>{const c=IDS.filter(i=>ok(i)&&G.people[i].stress>=55).sort((a,b)=>G.people[b].stress-G.people[a].stress);return c[0]||null},title:L('Per daug darbų','Too much on the plate'),
    text:a=>L(`${NM(a).lt}: „Turiu tris skubius darbus vienu metu. Nespėsiu.“`,`${NM(a).en}: “I’ve got three urgent things at once. I won’t make it.”`),
    opts:[
      {n:L('Kartu nuspręsti, kas svarbiausia','Decide together what matters most'),fx:a=>{dS(a,-12);dT(a,5);return L('Aiškūs prioritetai sumažina stresą labiau nei papildomos valandos.','Clear priorities reduce stress more than extra hours do.')}},
      {n:L('Perskirstyti dalį darbų kitiems','Hand some of the work to others'),fx:a=>{dS(a,-15);IDS.filter(i=>i!==a&&ok(i)).slice(0,2).forEach(i=>dS(i,5));dC('commitment',2);return L('Krūvis pasiskirstė, bet kitiems padaugėjo. Verta paaiškinti, kodėl.','The load is shared, but the others got more. Worth explaining why.')}},
      {n:L('„Susitvarkysi, tu stiprus“','“You’ll manage, you’re strong”'),fx:a=>{dS(a,10);dT(a,-6);return L('Padrąsinimas be pagalbos skamba kaip „tai tavo problema“.','Encouragement without help sounds like “that’s your problem”.')}}],
    miss:a=>{dS(a,10);return L(`${NM(a).lt} skendo darbuose be pagalbos`,`${NM(a).en} drowned in work without help`)}},
  late:{icon:'clock',pick:()=>pickOne(IDS.filter(i=>ok(i)&&i!=='tomas')),title:L('Vėlavimas','Running late'),
    text:a=>L(`${NM(a).lt} šią savaitę jau trečią kartą vėluoja. Kiti tai mato.`,`${NM(a).en} is late for the third time this week. Everyone notices.`),
    opts:[
      {n:L('Privačiai paklausti: „Kas vyksta?“','Ask privately: “What’s going on?”'),fx:a=>{dT(a,5);dC('accountability',4);if(G.people[a].mot==='stability'){if(!G.people[a].known)RT.cnt.reveal++;G.people[a].known=true}
        return L('Paaiškėjo, kad namuose sunkus laikotarpis. Klausdamas „kas vyksta“, o ne „kodėl vėluoji“, išgirsti tiesą.','Turns out things are hard at home. Ask “what’s going on” rather than “why are you late”, and you hear the truth.')}},
      {n:L('Pajuokauti apie tai prie visų','Make a joke about it in front of everyone'),fx:a=>{dS(a,6);dT(a,-8);return L('Kiti nusijuokė, bet žmogus pasijuto pažemintas. Atskaitomybė ir gėda nėra tas pats.','The others laughed, but they felt humiliated. Accountability and shame are not the same thing.')}},
      {n:L('Nieko nesakyti','Say nothing'),cost:5,fx:a=>{dC('accountability',-5);allT(-1);return L('Kiti mato, kad taisyklės galioja ne visiems. Atskaitomybė tirpsta tyliai.','The others see the rules don’t apply to everyone. Accountability melts away quietly.')}}],
    miss:a=>{dC('accountability',-5);return L(`${GEN(a).lt} vėlavimas liko be dėmesio`,`${NM(a).en}’s lateness went unaddressed`)}},
  credit:{icon:'!',once:true,pick:()=>!G.flags.m_credit&&ok('tomas')&&ok('lina')?'tomas':null,title:L('Svetima idėja','Someone else’s idea'),
    text:a=>L('Tomas komandos pokalbyje pristatė Linos idėją kaip savo. Lina tyli.','In the team chat, Tom presented Lena’s idea as his own. Lena says nothing.'),
    opts:[
      {n:L('Viešai paminėti, kad idėja Linos','Say publicly that it was Lena’s idea'),fx:a=>{dT('lina',8);dT('tomas',-4);dC('results',4);return L('Teisingumas viešai stiprina visą komandą. Tomas nepatenkintas, bet supranta ribas.','Fairness in public strengthens the whole team. Tom isn’t happy, but he knows the line.')}},
      {n:L('Pasikalbėti su Tomu privačiai','Talk to Tom privately'),fx:a=>{dT('lina',2);dC('accountability',4);return L('Tomas suprato, bet Lina nežino, kad ją užstojai.','Tom got the message, but Lena doesn’t know you stood up for her.')}},
      {n:L('Nieko nedaryti','Do nothing'),cost:5,fx:a=>{dT('lina',-8);dC('results',-4);return L('Lina išmoko, kad idėjų čia geriau garsiai nesakyti.','Lena learned it’s better not to share ideas out loud here.')}}],
    miss:a=>{dT('lina',-8);dC('results',-4);return L('Tomas pasisavino Linos idėją, ir niekas nieko nepasakė','Tom took credit for Lena’s idea, and nobody said a word')}},
  dayoff:{icon:'q',pick:()=>pickOne(IDS.filter(ok)),title:L('Prašymas','A request'),
    text:a=>L(`${NM(a).lt}: „Ar galėčiau išeiti po pietų? Vaikas susirgo.“`,`${NM(a).en}: “Could I leave after lunch? My kid is sick.”`),
    opts:[
      {n:L('Leisti be klausimų','Say yes, no questions'),cost:5,fx:a=>{dT(a,10);dS(a,-10);extra(-6);return L('Pasitikėjimas kaupiasi tokiomis akimirkomis. Žmonės prisimena, kaip elgeisi, kai jiems buvo sunku.','Trust is built in moments like this. People remember how you acted when things were hard.')}},
      {n:L('Leisti, bet paprašyti perduoti skubius darbus','Say yes, but ask them to hand over urgent work'),fx:a=>{dT(a,6);dS(a,-6);extra(-3);dC('commitment',2);return L('Rūpestis ir atsakomybė kartu: darbas nesustojo, žmogus jaučiasi išgirstas.','Care and responsibility together: work didn’t stop, and they feel heard.')}},
      {n:L('Atsisakyti: terminas','Say no: there’s a deadline'),cost:5,fx:a=>{dS(a,12);dT(a,-12);return L('Terminas išsaugotas, bet žmogus dirbs galvodamas apie namus. Ir prisimins.','The deadline is safe, but they’ll work with their mind at home. And they’ll remember.')}}],
    miss:a=>{dT(a,-6);dS(a,6);return L(`${NM(a).lt} prašė laisvos popietės, bet atsakymo nesulaukė`,`${NM(a).en} asked for the afternoon off and got no answer`)}},
  gossip:{icon:'dots',pick:()=>{const t=IDS.filter(i=>ok(i)&&G.people[i].trait&&G.people[i].trait!=='resolute');return t[0]||pickOne(IDS.filter(ok))},title:L('Apkalbos','Gossip'),
    text:a=>L(`Virtuvėje ${NM(a).lt} skundžiasi kolegomis, kai jų nėra šalia.`,`In the kitchen, ${NM(a).en} is complaining about colleagues behind their backs.`),
    opts:[
      {n:L('Pasakyti: „Apie tai verta kalbėti tiesiai jiems“','Say: “That’s worth saying to them directly”'),fx:a=>{dC('conflict',5);dT(a,-2);allT(2);return L('Tu nustatei normą: nesutarimai sprendžiami atvirai. Nemalonu, bet sveika.','You set a norm: disagreements are handled openly. Uncomfortable, but healthy.')}},
      {n:L('Paklausti, kas iš tikrųjų erzina','Ask what’s really bothering them'),fx:a=>{dT(a,5);dS(a,-6);return L('Po skundu dažnai slypi nuovargis ar neišspręsta problema. Dabar ją žinai.','Behind a complaint there’s often fatigue or an unsolved problem. Now you know what it is.')}},
      {n:L('Apsimesti, kad negirdėjai','Pretend you didn’t hear'),cost:5,fx:a=>{allT(-2);dC('conflict',-3);return L('Apkalbos tęsiasi. Komanda mato, kad vadovas tai toleruoja.','The gossip goes on. The team sees their manager tolerates it.')}}],
    miss:a=>{allT(-2);dC('conflict',-3);return L('Apkalbos virtuvėje liko be atsako','Kitchen gossip went unanswered')}},
  idea:{icon:'bulb',pick:()=>pickOne(IDS.filter(i=>ok(i)&&G.people[i].trust>=35)),title:L('Nedrąsi idėja','A shy idea'),
    text:a=>L(`${NM(a).lt} pusbalsiu užsimena, kad žino, kaip pagreitinti darbą, bet „turbūt nieko čia nepakeisi“.`,`${NM(a).en} mentions under their breath that they know how to speed things up, but “nothing ever changes here anyway”.`),
    opts:[

function toast(html,mentor){const el=document.getElementById('toast'),d=document.createElement('div');if(mentor)d.className='m';d.innerHTML=html;el.appendChild(d);while(el.children.length>2)el.removeChild(el.firstChild);setTimeout(()=>d.remove(),5200)}
function mentor(key,msg){if(RT.mentorShown[key])return;RT.mentorShown[key]=1;G.mentorShown=RT.mentorShown;toast(`<b>${u('mentor')}:</b> ${t(msg)}`,true)}

  visit:m=>{const id=m.who;dS(id,6);dT(id,-6);G.stats.missed++;logE('bad',NL(id,' ieškojo tavęs, bet nesulaukė',' looked for you but you never came'));toast(`<b>${esc(pn(id))}</b> ${t(L('nesulaukė tavęs ir grįžo prie stalo.','gave up waiting and went back.'))}`);sendBack(id)},
  evx:m=>{dB(-6);G.stats.missed++;const E=EVENTS[m.ev];logE('bad',L(`Neatsakei: ${E.title.lt}`,`No response: ${E.title.en}`));toast(t(L('Niekas neatsakė. Vadovybė ir komanda tai pastebėjo.','Nobody answered. Leadership and the team noticed.')));if(m.who)sendBack(m.who)},
  hire:m=>{const id=m.who;FX=null;hireNow(id);dT(id,-8);dS(id,12);G.stats.missed++;logE('bad',NL(id,' pusę dienos laukė pokalbio',' waited half a day for the interview'));toast(`<b>${esc(pn(id))}</b> ${t(L('pradėjo dirbti be jokio įvedimo.','started work with no onboarding.'))}`)},

function addMarker(m){m.id=Math.random().toString(36).slice(2);RT.markers.push(m);if(m.kind==='phone')toast(`<b>☎</b> ${t(L('Skambina telefonas tavo kabinete.','The phone is ringing in your office.'))}`);
  if(m.who==='client')toast(t(L('Į biurą įėjo piktas klientas.','An angry client has walked in.')));
  if(m.who==='lina'&&m.ev===2)toast(`${esc(pn('lina'))} ${u('waiting')}.`);
  if(typeof m.ev==='number'&&m.ev>=5&&m.who)toast(`<b>${esc(pn(m.who))}</b> ${u('waiting')}.`);
  if(m.ev===3)toast(t(L('Virtuvėje kažkas garsiai ginčijasi.','Someone is arguing loudly in the kitchen.')));}
function spawnClient(){RT.chars.client={id:'client',x:SPOT.exit[0],y:SPOT.exit[1],path:[],state:'client',timer:999,say:null,sayT:0,phase:0};walkTo(RT.chars.client,...SPOT.client);say('client',L('Kur jūsų vadovas?!','Where’s your manager?!'),4)}
function leaveClient(){const c=RT.chars.client;if(!c)return;c.state='leaving';walkTo(c,...SPOT.exit)}
function sendBack(id){const c=RT.chars[id];if(!c||!act(id))return;c.state='walk';c.next='work';walkTo(c,...PEOPLE[id].seat)}

/* ---- update ---- */
function rate(id){const P=G.people[id];let m=P.stress<40?1:P.stress<70?0.9:0.75;if(P.trait==='resolute')m*=1.15;else if(P.trait)m*=0.55;m*=0.85+0.3*P.trust/100;if(RT.boost&&RT.boost[id])m*=1.15;if(RT.reduce&&RT.reduce[id])m*=0.6;if(G.lead){m*=id===G.lead?0.5:0.9+0.25*G.lskill/100}if(has('screen'))m*=1.06;return PEOPLE[id].base*m/6.7}
function tickSim(dm){
  const per=dm/60;
  IDS.forEach(id=>{const P=G.people[id],c=RT.chars[id];if(!act(id)||!c)return;
    if((c.state==='work'||c.state==='wait')&&!c.path.length){const r=rate(id)*per;G.out+=r;G.dayOut+=r}
    let s=1.1*per*(G.flags.overload&&G.day<=3?1.4:1)*(has('plants')?0.9:1)*(id===G.lead?1.2:1);
    if(c.state==='break')s-=(has('coffee')?2.6:1.6)*per;
    if(c.state==='window'&&has('lounge'))s-=2.4*per;
    if(P.trait==='resolute')s/=2;
    P.stress=clamp(P.stress+s,0,100);
    if(P.stress>=100)breakPoint(id)});
  if(G.tb)tbTick(per);
  // contagion
  IDS.filter(id=>act(id)&&G.people[id].trait&&G.people[id].trait!=='resolute').forEach(b=>{const cb=RT.chars[b];if(!cb)return;
    IDS.forEach(o=>{if(o===b||!act(o))return;const co=RT.chars[o];if(co&&Math.hypot(co.x-cb.x,co.y-cb.y)<2.2)G.people[o].stress=clamp(G.people[o].stress+0.8*per,0,100)})});
}
function breakPoint(id){
  const P=G.people[id];
  if(P.trait&&P.trait!=='resolute'){P.quit=true;logE('bad',NL(id,' išėjo iš komandos',' left the team'));RT.dayIns.push(NL(id,' išėjo. Lūžęs žmogus be pagalbos ilgai neišbūna.',' quit. A broken person without support doesn’t stay long.'));
    toast(`<b>${esc(pn(id))}</b> ${t(L('išeina iš darbo.','is quitting.'))}`);const c=RT.chars[id];if(c){c.state='leaving';walkTo(c,...SPOT.exit);say(id,L('Viskas. Išeinu.','That’s it. I’m out.'),4)}
    if(IDS.filter(x=>G.people[x].quit).length>=Math.min(3,hiredN()-1)){G.over='collapse';setTimeout(endWeekNow,1800)}return}
  if(!P.trait&&P.trust>=65&&Math.random()<0.4){P.trait='resolute';P.stress=55;logE('good',NL(id,' atlaikė spaudimą',' held up under pressure'));RT.dayIns.push(NL(id,' atlaikė, nes tavimi pasitiki.',' held up because they trust you.'));toast(`<b>${esc(pn(id))}</b> ${t(L('atlaikė spaudimą ir tapo atsparesnis.','held up and became resolute.'))}`);return}
  if(!P.trait){P.trait=rnd(['cynic','withdrawn','hostile']);P.stress=80;logE('bad',NL(id,' lūžo nuo streso',' broke under stress'));RT.dayIns.push(NL(id,' lūžo. Stresas, kurio niekas nesumažino, pasiekė ribą.',' broke. Stress nobody reduced hit the limit.'));
    toast(`<b>${esc(pn(id))}</b> ${t(L('lūžo nuo streso.','has broken under stress.'))}`);
    mentor('broke',L('Lūžęs žmogus dirba prasčiau ir kelia stresą kitiems. Pokalbis, kuriame tik klausaisi, gali jį susigrąžinti.','A broken person works worse and stresses others. A conversation where you just listen can bring them back.'))}
  else P.stress=90;
}
function updateNPC(c,dm,dt){
  const id=c.id,P=G.people[id];
  if(c.sayT>0)c.sayT-=dt;
  if(c.path.length){moveAlong(c,dt,2.6);if(!c.path.length)arrived(c);return}
  if(c.state==='walk'){arrived(c);return}
  if(c.state==='leaving'){delete RT.chars[id];return}
  if(['wait','meeting','visit','client','fight','held','cand','tb'].includes(c.state)){
    if(c.state==='fight'&&Math.random()<dt*0.5)say(id,rnd([L('Tu nesupranti!','You don’t get it!'),L('Čia mano sritis!','This is my area!'),L('Nesutinku!','I disagree!')]),2);
    if(c.state==='wait'){c.timer-=dm;if(c.timer<=0)sendBack(id)}
    return}
  if(c.state==='break'||c.state==='window'||c.state==='help'){c.timer-=dm;
    if(c.state==='break'&&Math.random()<dt*0.12){const near=Object.values(RT.chars).find(o=>o!==c&&o.state==='break'&&Math.hypot(o.x-c.x,o.y-c.y)<2.5);
      if(P&&P.trait==='cynic')say(id,rnd(AMB.cynic));else if(near)say(id,rnd(AMB.chat))}
    if(c.timer<=0){c.state='walk';c.next='work';walkTo(c,...PEOPLE[id].seat)}return}
  if(c.state==='work'){c.timer-=dm;
    if(P&&Math.random()<dt*0.04){if(P.trait&&P.trait!=='resolute')say(id,rnd(AMB[P.trait]||AMB.stressed));else if(P.stress>=70)say(id,rnd(AMB.stressed));else if(P.trait==='resolute')say(id,rnd(AMB.resolute));else if(P.trust>=70&&P.stress<40)say(id,rnd(AMB.happy))}
    if(c.timer<=0){c.timer=60+Math.random()*80;
      if(P.trait==='withdrawn')return;
      const go=Math.random()<(0.35+(P.stress>=60?0.3:0));if(!go)return;
      if(P.stress>=80&&Math.random()<0.5){const w=freeSpot(SPOT.window);c.state='walk';c.next='window';c.dur=25+Math.random()*20;walkTo(c,...w);return}
      const k=freeSpot(SPOT.kitchen);c.state='walk';c.next='break';c.dur=20+Math.random()*25;walkTo(c,...k)}}
}
function arrived(c){
  if(c.state==='walk'){c.state=c.next||'work';c.timer=c.state==='work'?60+Math.random()*80:(c.dur||25);if(c.state==='window')say(c.id,AMB.window[0],3)}
  if(c.state==='leaving'){delete RT.chars[c.id]}
}
function moveAlong(c,dt,speed){
  let d=speed*dt;
  while(d>0&&c.path.length){const [tx,ty]=c.path[0],dx=tx-c.x,dy=ty-c.y,dist=Math.hypot(dx,dy);
    if(dist<=d){c.x=tx;c.y=ty;c.path.shift();d-=dist}else{c.x+=dx/dist*d;c.y+=dy/dist*d;d=0}
    if(Math.abs(dx)>0.01)c.face=dx>0?1:-1;c.dir=Math.abs(dy)>Math.abs(dx)?(dy<0?'up':'down'):'side'}
  c.phase=(c.phase||0)+dt*12;
}
function updatePlayer(dt){
  const p=RT.player;if(!p.path.length)return;moveAlong(p,dt,4.2);
  if(!p.path.length&&p.pending){const a=p.pending;p.pending=null;doAction(a)}
}
function step(dtReal){
  if(!G||!RT)return;
  if(RT.paused)return;
  const dm=dtReal*SPEEDS[RT.speed];RT.time+=dm;
  updatePlayer(dtReal);
  Object.values(RT.chars).forEach(c=>updateNPC(c,dm,dtReal));
  tickSim(dm);
  // markers
  curSched().forEach((e,i)=>{if(e.d===G.day&&!RT.fired[i]&&RT.time>=e.t){RT.fired[i]=1;e.run()}});
  if(G.leadMode&&!G.lead&&!SH&&over.hidden){openLeadPick();return}
  RT.markers.filter(m=>m.leadAt&&RT.time>=m.leadAt).forEach(m=>{if(G.lead&&ok(G.lead))leadHandle(m);else m.leadAt=null});
  RT.markers=RT.markers.filter(m=>{if(RT.time>m.until){RT.cnt.miss++;RT.combo=0;MISS[m.miss]&&MISS[m.miss](m);return false}return true});
  if(G.tb&&G.lead){RT.tbT=(RT.tbT??50)-dm;if(RT.tbT<=0){RT.tbT=80+Math.random()*40;if(!RT.chars.ruta&&(RT.tbN||0)<3&&RT.time<16*60+30)spawnRuta()}}
  RT.microT-=dm;if(RT.microT<=0){RT.microT=25+Math.random()*20;if(RT.markers.length<2&&RT.time<17*60+15)spawnMicro()}
  if(!RT.player.path.length&&!RT.player.pending&&!RT.meeting)RT.idle+=dm;else RT.idle=0;
  if(RT.idle>=30&&!RT.markers.length){RT.idle=-25;idleHint()}
  // stressed people come to you
  RT.visitCheck-=dm;if(RT.visitCheck<=0){RT.visitCheck=30;
    const id=IDS.find(id=>act(id)&&RT.chars[id]&&RT.chars[id].state==='work'&&G.people[id].stress>=82&&!RT.talked[id]&&!RT.markers.some(m=>m.who===id)&&!(RT.visited||{})[id]);
    if(id&&RT.time<17*60){RT.visited=RT.visited||{};RT.visited[id]=1;const c=RT.chars[id];c.state='visit';walkTo(c,SPOT.door[0]+1,SPOT.door[1]);
      addMarker({kind:'npc',who:id,ev:'visit',until:RT.time+(has('door')?80:60),miss:'visit'});
      toast(`<b>${esc(pn(id))}</b> ${t(L('ateina pasikalbėti.','is coming to talk to you.'))}`);
      mentor('visit',L('Kai žmogus pats ateina pas vadovą, tai signalas. Jei jo neišklausysi, kitą kartą jis nebeateis.','When someone comes to you on their own, it’s a signal. Ignore it, and next time they won’t come.'))}}
  const near=IDS.find(id=>act(id)&&G.people[id].stress>=85&&!G.people[id].trait);
  if(near)mentor('near_'+near,NL(near,' arti lūžio. Stresas virš 85. Pasiekęs 100 jis lūš.',' is close to breaking. Stress above 85. At 100 they break.'));
  if(RT.time>=18*60)endDay();
  if(G.boss<=0&&!G.over){G.over='fired';endWeekNow()}
}

const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
let T=40,OY=24,DPR=1;
function resize(){
  const w=document.querySelector('.game').clientWidth;DPR=Math.min(2,window.devicePixelRatio||1);
  T=Math.max(16,Math.floor(Math.min(w/COLS,(window.innerHeight-190)/(ROWS+0.6))));OY=Math.round(T*0.6);
  const W=T*COLS,H=T*ROWS+OY;cv.width=W*DPR;cv.height=H*DPR;cv.style.height=H+'px';cv.style.width=W+'px';cv.parentElement.style.width=W+'px';
}
window.addEventListener('resize',resize);
cv.addEventListener('click',e=>{
  if(!G||!RT||RT.paused)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/T,y=(e.clientY-r.top-OY)/T;
  // characters (drawn about 0.3 tile above their tile centre)
  let best=null,bd=0.7;
  Object.values(RT.chars).forEach(c=>{const d=Math.hypot(c.x+0.5-x,c.y+0.2-y);if(d<bd){bd=d;best=c}});
  if(best&&best.state!=='leaving'){approach({kind:'npc',id:best.id});return}
  const c=Math.floor(x),rr=Math.floor(y);if(rr<0||rr>=ROWS||c<0||c>=COLS)return;
  const ch=MAP[rr][c];
  if(ch==='b'||(c===2&&rr===2)){approach({kind:'desk'});return}
  if(region(c,rr)==='meet'&&(ch==='t'||ch==='m')){approach({kind:'meeting'});return}
  if(walkable(c,rr)){if(walkTo(RT.player,c,rr)){RT.player.pending=null;RT.tap={x:c,y:rr,t:0.6}}}
  else document.getElementById('hint').textContent=u('noPath');
});
function adjacent(tx,ty){
  const p=RT.player,opts=[[tx,ty+1],[tx-1,ty],[tx+1,ty],[tx,ty-1]].filter(([c,r])=>walkable(c,r));
  opts.sort((a,b)=>Math.hypot(a[0]-p.x,a[1]-p.y)-Math.hypot(b[0]-p.x,b[1]-p.y));return opts[0];
}
function approach(a){
  const p=RT.player;let dest;
  if(a.kind==='npc'){const c=RT.chars[a.id];if(!c)return;
    if(c.id!=='client'&&!['visit','fight','meeting','cand','tb'].includes(c.state)){if(c.path.length){c.path=[c.path[0]]}c.prev=c.state==='wait'?c.prev:c.state;c.state='wait';c.timer=40}
    const tx=Math.round(c.path.length?c.path[0][0]:c.x),ty=Math.round(c.path.length?c.path[0][1]:c.y);
    if(Math.hypot(p.x-tx,p.y-ty)<=1.05){doAction(a);return}
    dest=adjacent(tx,ty)}
  else if(a.kind==='desk')dest=SPOT.desk;
  else if(a.kind==='meeting')dest=SPOT.meetP;
  if(!dest||(Math.round(p.x)===dest[0]&&Math.round(p.y)===dest[1])){doAction(a);return}
  if(walkTo(p,dest[0],dest[1]))p.pending=a;
}
function doAction(a){
  if(a.kind==='npc'){
    const m=RT.markers.find(m=>m.who===a.id||m.also===a.id);
    if(m&&m.tb!==undefined){RT.markers=RT.markers.filter(x=>x!==m);openTBE(m.tb);return}
    if(m&&m.hire){RT.markers=RT.markers.filter(x=>x!==m);openInterview(a.id);return}
    if(m&&m.micro){RT.markers=RT.markers.filter(x=>x!==m);if(m.leadAt&&G.lead&&ok(G.lead)){dA(-4);dT(G.lead,-3);toast(`${t(L('Apėjai','You went around'))} <b>${esc(pn(G.lead))}</b>. ${t(L('Autoritetas −4.','Authority −4.'))}`);
      mentor('bypass',L('Kai sprendi už komandos vadovą, komanda mokosi eiti pas tave, o ne pas jį. Geriau koučink jį.','When you solve things for the team lead, the team learns to come to you instead of them. Coach them instead.'))}openMicro(m);return}
    if(m&&typeof m.ev==='number'){RT.markers=RT.markers.filter(x=>x!==m);openEvent(m.ev,a.id);return}
    if(m&&m.ev==='visit'){RT.markers=RT.markers.filter(x=>x!==m);hit();gain(2,a.id)}
    if(a.id==='client')return;
    if(a.id==='ruta')return;
    if(G.lead&&a.id===G.lead){openCoach(a.id);return}
    openPerson(a.id);return}
  if(a.kind==='desk'){const m=RT.markers.find(m=>m.kind==='phone');if(m){RT.markers=RT.markers.filter(x=>x!==m);openEvent(m.ev);return}openDesk();return}
  if(a.kind==='meeting')openMeetingAsk();
}

const scrim=document.getElementById('scrim'),sheet=document.getElementById('sheet');
let SH=null; // current sheet {render, cost}
function openSheet(obj){SH=obj;RT.paused=true;RT.idle=0;scrim.hidden=false;renderSheet()}
function renderSheet(){sheet.innerHTML=SH.book?`<h2>${t(L('Įžvalgų knyga','Book of insights'))}</h2><p class="eyebrow">${cardsN()}/${CARD_TOTAL}</p>${cardsH()}<button class="btn ghost" data-sh="back">${t(L('Atgal','Back'))}</button>`:SH.dos?`${dossierH(SH.dos)}<button class="btn ghost" data-sh="back">${t(L('Atgal','Back'))}</button>`:SH.render();sheet.scrollTop=0}
function closeSheet(){scrim.hidden=true;const cost=SH&&SH.cost||0;const after=SH&&SH.after;SH=null;RT.paused=false;if(cost)skip(cost);after&&after();renderHUD();setTimeout(nextCons,300)}
function skip(min){let left=min;while(left>0){const d=Math.min(5,left);RT.time+=d;tickSim(d);left-=d}Object.values(RT.chars).forEach(c=>{if(c.state==='wait')sendBack(c.id)});if(RT.time>=18*60)endDay()}
function avatarH(id,lg){const P=G.people[id];const ring=!P||P.quit?'var(--line)':P.stress>=70?'var(--bad)':P.stress>=40?'var(--mark)':'var(--good)';
  return `<span class="av${lg?' lg':''}" style="background:${id==='client'?'#555':PEOPLE[id].shirt};--ring:${ring}">${esc(pn(id)[0])}</span>`}
const bar=(v,c)=>`<span class="track"><i style="width:${clamp(v,0,100)}%;${c?`background:${c}`:''}"></i></span>`;
const sColor=s=>s>=70?'var(--bad)':s>=40?'var(--mark)':'var(--good)';
const sayH=(id,line)=>`<div class="say">${avatarH(id)}<div class="bubble">${esc(tx(line))}</div></div>`;
const insightH=(i,label)=>i?`<div class="insight"><span class="eyebrow">${label||u('why')}</span><p>${t(i)}</p></div>`:'';
function traitName(id){const P=G.people[id];return P.trait?t(TRAITS[P.trait].n[PEOPLE[id].f?'f':'m']):''}
function fxH(list){
  if(!list||!list.length)return '';
  const merged=[];list.forEach(f=>{const e=merged.find(x=>x.who===f.who&&x.key===f.key);if(e)e.v+=f.v;else merged.push({...f})});
  const lab=f=>{const k=f.key,n=k==='stress'?L('stresas','stress'):k==='trust'?L('pasitikėjimas tavimi','trust in you'):k==='boss'?UI.boss:k==='plan'?L('planas','target'):k==='out'?metricName():k==='tbS'?L('Antros komandos stresas','Team two stress'):k==='tbM'?L('Antros komandos nuotaika','Team two morale'):k==='tbA'?L('Rūtos autoritetas','Ruth’s authority'):k==='tbK'?L('Rūtos įgūdis','Ruth’s skill'):k==='tbL'?L('Rūtos stresas','Ruth’s stress'):k==='tbT'?L('Rūtos pasitikėjimas tavimi','Ruth’s trust in you'):k==='auth'?L('Vadovo autoritetas','Lead’s authority'):k==='lskill'?L('Vadovo įgūdis','Lead’s skill'):LAYER[k];
    return (f.who==='all'?u('allTeam')+' · ':f.who?pn(f.who)+' · ':'')+t(n)};
  return `<div class="deltas">${merged.filter(f=>Math.round(f.v)).map(f=>{const bad=['stress','plan','tbS','tbL'].includes(f.key)?f.v>0:f.v<0;
    return `<div class="delta"><span>${esc(lab(f))}</span><b class="${bad?'neg':''}">${f.v>0?'+':'−'}${Math.abs(Math.round(f.v))}${f.key==='plan'?' %':''}</b></div>`}).join('')}</div>`;
}

  else if(c===P.mot){G.stats.right++;if(!P.known)RT.cnt.reveal++;P.known=true;dS(id,-15);dT(id,10);RT.boost[id]=1;reply=m.yes;ins=L('Pataikei. Kai žinai, kas žmogų motyvuoja, net trumpas pokalbis veikia stipriai.','Spot on. When you know what drives someone, even a short talk goes a long way.')}

  const res={reply,fx:FX,ins};FX=null;
  know(id,1+(c==='listen'&&P.trust>=30?1:0)+(c===P.mot?1:0));gain(c==='listen'?(!knew&&P.known?4:1):c===P.mot?4:c==='reduce'?1:c==='sbi'?3:0,id);return res;

  ctx.lineWidth=2;ctx.strokeStyle='#3A6EA5';ctx.strokeRect(x+T*0.18,y+T*0.53,T*0.36,T*0.22);ctx.strokeStyle='#D48A3A';ctx.strokeRect(x+T*0.8,y+T*0.53,T*0.36,T*0.22);

  const ds=(G&&G.days)||[],n=5,bw=(w-T*0.3)/n;for(let i=0;i<n;i++){const d=ds[i],h=d?clamp(d.out/d.plan,0.1,1.2)*T*0.32:T*0.04;ctx.fillStyle=d?(d.out>=d.plan?'#6CC29C':'#E08A80'):'#3A4552';ctx.fillRect(x+T*0.15+i*bw,y+T*0.86-h,bw*0.6,h)}}

function person(c,look,o){
  const px=c.x*T+T/2,py=c.y*T+T*0.62,walking=c.path&&c.path.length,bob=walking?Math.abs(Math.sin(c.phase||0))*T*0.05:0;
  const sit=o.sit,s=T;
  ctx.fillStyle=COL.shadow;ctx.beginPath();ctx.ellipse(px,py+s*0.18,s*0.24,s*0.08,0,0,7);ctx.fill();
  if(o.ring){ctx.strokeStyle='#D2B06E';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(px,py+s*0.18,s*0.3,s*0.11,0,0,7);ctx.stroke()}
  const by=py-bob-(sit?-s*0.04:0);
  if(!sit){const sw=walking?Math.sin(c.phase)*s*0.06:0;ctx.fillStyle=COL.pants;ctx.fillRect(px-s*0.13,by-s*0.02+sw,s*0.1,s*0.18);ctx.fillRect(px+s*0.03,by-s*0.02-sw,s*0.1,s*0.18)}
  ctx.fillStyle=look.shirt;rr(px-s*0.19,by-s*0.36,s*0.38,s*0.38,s*0.1);ctx.fill();
  if(look.tie){ctx.fillStyle=look.tie;ctx.fillRect(px-s*0.025,by-s*0.33,s*0.05,s*0.2)}
  const typing=o.type?Math.sin(performance.now()/90+(c.phase||0))*s*0.02:0;
  ctx.fillStyle=look.skin;ctx.beginPath();ctx.arc(px-s*0.2,by-s*0.12+typing,s*0.06,0,7);ctx.arc(px+s*0.2,by-s*0.12-typing,s*0.06,0,7);ctx.fill();
  const hy=by-s*0.5;
  ctx.fillStyle=look.skin;ctx.beginPath();ctx.arc(px,hy,s*0.17,0,7);ctx.fill();
  ctx.fillStyle=look.hair;
  if(o.back){ctx.beginPath();ctx.arc(px,hy-s*0.01,s*0.175,0,7);ctx.fill();if(look.long){ctx.fillRect(px-s*0.17,hy,s*0.34,s*0.18)}}
  else{ctx.beginPath();ctx.arc(px,hy-s*0.03,s*0.175,Math.PI*1.02,Math.PI*1.98);ctx.fill();ctx.fillRect(px-s*0.175,hy-s*0.05,s*0.35,s*0.06);
    if(look.long){ctx.fillRect(px-s*0.19,hy-s*0.04,s*0.07,s*0.24);ctx.fillRect(px+s*0.12,hy-s*0.04,s*0.07,s*0.24)}
    ctx.fillStyle='#1E2328';ctx.beginPath();ctx.arc(px-s*0.06,hy+s*0.02,s*0.022,0,7);ctx.arc(px+s*0.06,hy+s*0.02,s*0.022,0,7);ctx.fill()}
  if(o.headphones){ctx.strokeStyle='#22282E';ctx.lineWidth=s*0.05;ctx.beginPath();ctx.arc(px,hy,s*0.2,Math.PI,0);ctx.stroke()}
  return {px,top:hy-s*0.2};
}
function iconAbove(px,top,kind,t0){
  const y=top-T*0.28+Math.sin(t0/250)*T*0.03;
  if(kind==='!'){ctx.fillStyle='#F2C14E';ctx.beginPath();ctx.arc(px,y,T*0.2,0,7);ctx.fill();ctx.fillStyle='#1E2328';ctx.font=`700 ${Math.round(T*0.28)}px IBM Plex Sans, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('!',px,y+1);return}
  if(kind==='star'){ctx.fillStyle='#F2C14E';ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=(i%2?0.09:0.21)*T;ctx.lineTo(px+Math.cos(a)*rad,y+Math.sin(a)*rad)}ctx.closePath();ctx.fill();return}
  if(kind==='q'||kind==='clock'||kind==='bulb'||kind==='papers'){ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.arc(px,y,T*0.2,0,7);ctx.fill();ctx.strokeStyle='#F2C14E';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#1E2328';ctx.strokeStyle='#1E2328';ctx.lineWidth=1.6;
    if(kind==='q'){ctx.font=`700 ${Math.round(T*0.26)}px IBM Plex Sans, sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('?',px,y+1)}
    if(kind==='clock'){ctx.beginPath();ctx.arc(px,y,T*0.11,0,7);ctx.stroke();ctx.beginPath();ctx.moveTo(px,y);ctx.lineTo(px,y-T*0.07);ctx.moveTo(px,y);ctx.lineTo(px+T*0.06,y);ctx.stroke()}
    if(kind==='bulb'){ctx.fillStyle='#F2C14E';ctx.beginPath();ctx.arc(px,y-T*0.03,T*0.08,0,7);ctx.fill();ctx.fillStyle='#1E2328';ctx.fillRect(px-T*0.04,y+T*0.05,T*0.08,T*0.05)}
    if(kind==='papers'){ctx.fillStyle='#E9EDF1';ctx.strokeStyle='#59626D';[[-0.07,0.03],[-0.03,-0.01],[0.01,-0.05]].forEach(([dx,dy])=>{ctx.fillRect(px+dx*T-T*0.05,y+dy*T-T*0.06,T*0.12,T*0.14);ctx.strokeRect(px+dx*T-T*0.05,y+dy*T-T*0.06,T*0.12,T*0.14)})}
    return}
  if(kind==='cloud'||kind==='storm'){ctx.fillStyle=kind==='storm'?'#59626D':'#9AA4AE';[[-0.12,0,0.11],[0.02,-0.05,0.13],[0.15,0.01,0.1]].forEach(([dx,dy,r])=>{ctx.beginPath();ctx.arc(px+dx*T,y+dy*T,r*T,0,7);ctx.fill()});
    if(kind==='storm'){ctx.strokeStyle='#F2C14E';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(px,y+T*0.08);ctx.lineTo(px-T*0.05,y+T*0.18);ctx.lineTo(px+T*0.02,y+T*0.18);ctx.lineTo(px-T*0.03,y+T*0.28);ctx.stroke()}return}
  if(kind==='anger'){ctx.strokeStyle='#E0574A';ctx.lineWidth=2.2;ctx.beginPath();for(let i=0;i<4;i++){const a=i*Math.PI/2+Math.PI/4;ctx.moveTo(px+Math.cos(a)*T*0.05,y+Math.sin(a)*T*0.05);ctx.lineTo(px+Math.cos(a)*T*0.14,y+Math.sin(a)*T*0.14)}ctx.stroke();return}
  if(kind==='dots'){ctx.fillStyle='#7C8691';[-1,0,1].forEach(i=>{ctx.beginPath();ctx.arc(px+i*T*0.09,y,T*0.035,0,7);ctx.fill()});return}
  if(kind==='heart'){ctx.fillStyle='#E07A8A';ctx.beginPath();ctx.arc(px-T*0.05,y,T*0.06,0,7);ctx.arc(px+T*0.05,y,T*0.06,0,7);ctx.moveTo(px-T*0.11,y+T*0.02);ctx.lineTo(px,y+T*0.14);ctx.lineTo(px+T*0.11,y+T*0.02);ctx.fill()}
}
function speech(px,top,text){
  ctx.font=`500 ${Math.max(10,Math.round(T*0.27))}px IBM Plex Sans, sans-serif`;const w=Math.min(ctx.measureText(text).width+T*0.4,T*5.2),h=T*0.48;
  let x=clamp(px-w/2,2,ctx.canvas.width/DPR-w-2),y=top-T*0.62-h;
  ctx.fillStyle='rgba(255,255,255,.96)';rr(x,y,w,h,T*0.12);ctx.fill();ctx.beginPath();ctx.moveTo(px-T*0.08,y+h);ctx.lineTo(px,y+h+T*0.12);ctx.lineTo(px+T*0.08,y+h);ctx.fill();
  ctx.fillStyle='#1E2328';ctx.textAlign='left';ctx.textBaseline='middle';ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.fillText(text,x+T*0.2,y+h/2+1);ctx.restore();
}
const LOOK=Object.fromEntries(IDS.map(id=>[id,PEOPLE[id]]));
LOOK.ruta={shirt:'#5B4B8A',skin:'#EBC2A2',hair:'#2B1D16',long:true};LOOK.player={shirt:'#1C3550',skin:'#E5B48F',hair:'#2B2018',tie:'#D2B06E'};LOOK.client={shirt:'#4B5058',skin:'#D9A57E',hair:'#55493F',tie:'#A33'};
function draw(){
  const now=performance.now();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#141A20';ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.translate(0,OY);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!'#W'.includes(MAP[r][c]))floor(c,r);
  if(has('lounge'))lounge();
  if(RT&&RT.tap&&RT.tap.t>0){ctx.strokeStyle='rgba(28,53,80,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(RT.tap.x*T+T/2,RT.tap.y*T+T*0.8,T*0.3*(1.2-RT.tap.t/2),T*0.12,0,0,7);ctx.stroke()}
  const L2=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const ch=MAP[r][c];
    if(ch==='#'||ch==='W')L2.push({y:r+0.99,f:()=>wall(c,r)});
    else if(ch==='d'&&MAP[r][c-1]!=='d')L2.push({y:r+0.7,f:()=>desk(c,r)});
    else if(ch==='b'&&MAP[r][c-1]!=='b')L2.push({y:r+0.7,f:()=>bossDesk(c,r)});
    else if(ch==='t'&&MAP[r][c-1]!=='t'&&MAP[r-1][c]!=='t')L2.push({y:r+1.7,f:()=>table(c,r)});
    else if(ch==='c')L2.push({y:r+0.9,f:()=>counter(c,r)});
    else if(ch==='p')L2.push({y:r+0.9,f:()=>plant(c,r)});}
  IDS.forEach(id=>{const [c,r]=PEOPLE[id].seat;L2.push({y:r+0.3,f:()=>chair(c,r,true)})});
  L2.push({y:2.3,f:()=>chair(2,2,true)});
  SPOT.meet.forEach(([c,r])=>L2.push({y:r+0.3,f:()=>chair(c,r,false)}));
  if(has('coffee'))L2.push({y:11.95,f:()=>espresso(12,11)});
  if(has('plants'))PLANTS.forEach(([c,r])=>L2.push({y:r+0.9,f:()=>plant(c,r)}));
  if(has('board'))L2.push({y:0.995,f:whiteboard});
  if(has('door'))L2.push({y:5.995,f:doorSign});
  if(has('screen'))L2.push({y:5.995,f:resultsScreen});
  if(has('lounge'))[6,7].forEach(c=>L2.push({y:2.3,f:()=>armchair(c,2)}));
  const tops=[];
  if(RT){
    Object.values(RT.chars).forEach(c=>{const id=c.id,P=G.people[id];
      L2.push({y:c.y+0.62,f:()=>{const seated=id!=='client'&&!c.path.length&&c.state==='work'&&Math.round(c.x)===PEOPLE[id].seat[0]&&Math.round(c.y)===PEOPLE[id].seat[1];
        const res=person(c,LOOK[id],{sit:seated,back:seated||c.dir==='up',type:seated,headphones:P&&P.trait==='withdrawn'});tops.push({c,res,id})}})});
    const p=RT.player;L2.push({y:p.y+0.62,f:()=>{const res=person(p,LOOK.player,{ring:true,back:p.dir==='up'});tops.push({c:p,res,id:'player'})}});
  }
  if(RT&&RT.suggest&&RT.chars[RT.suggest]){const sc=RT.chars[RT.suggest],k=0.5+0.5*Math.sin(now/200);ctx.strokeStyle=`rgba(210,176,110,${0.5+0.5*k})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.ellipse(sc.x*T+T/2,sc.y*T+T*0.8,T*(0.34+0.06*k),T*(0.13+0.02*k),0,0,7);ctx.stroke()}
  L2.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // names, icons, bubbles
  if(RT){
    tops.forEach(({c,res,id})=>{if(id==='player')return;ctx.font=`500 ${Math.max(9,Math.round(T*0.22))}px IBM Plex Sans, sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillStyle='rgba(20,26,32,.75)';ctx.fillText(pn(id),res.px,c.y*T+T*0.86)});
    tops.forEach(({c,res,id})=>{
      const P=G.people[id],mk=RT.markers.find(m=>m.who===id||m.also===id);
      if(mk)iconAbove(res.px,res.top,mk.icon||'!',now);
      else if(P&&!P.quit){if(P.trait==='hostile')iconAbove(res.px,res.top,'anger',now);else if(P.trait==='cynic')iconAbove(res.px,res.top,'dots',now);
        else if(P.stress>=85)iconAbove(res.px,res.top,'storm',now);else if(P.stress>=65)iconAbove(res.px,res.top,'cloud',now);else if(P.trust>=70&&P.stress<35&&Math.sin(now/900+c.phase)>0.6)iconAbove(res.px,res.top,'heart',now)}
      if(c.say&&c.sayT>0)speech(res.px,res.top,tx(c.say))});
    const ph=RT.markers.find(m=>m.kind==='phone');if(ph)iconAbove(3*T+T*0.5,T*0.1,'!',now);
    (RT.floats||[]).forEach(f=>{const k=f.t/1.8,px=f.x*T+T/2,py=f.y*T-T*0.5-(1-k)*T*0.9;ctx.globalAlpha=Math.min(1,k*1.6);
      ctx.font=`600 ${Math.max(11,Math.round(T*0.34))}px IBM Plex Mono, monospace`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(20,26,32,.85)';ctx.strokeText(f.txt+' ◆',px,py);ctx.fillStyle='#E9C77F';ctx.fillText(f.txt+' ◆',px,py);ctx.globalAlpha=1});
  }
}
function drawHero(){
  const h=document.getElementById('hero');if(!h)return;
  const w=h.clientWidth||560,tT=Math.floor(w/COLS),rows=8.6;
  h.width=tT*COLS*DPR;h.height=Math.round(tT*rows)*DPR;h.style.height=Math.round(tT*rows)+'px';
  const keep={ctx,T,OY,RT,G};
  ctx=h.getContext('2d');T=tT;OY=-tT*5.4;RT=demoRT();
  if(!G)G={type:'sales',people:Object.fromEntries(IDS.map(id=>[id,{stress:30,trust:50}])),culture:{}};
  try{draw()}finally{ctx=keep.ctx;T=keep.T;OY=keep.OY;RT=keep.RT;G=keep.G}
}

    darius:{id:'darius',x:12,y:12,path:[],state:'break',phase:3},egle:{id:'egle',x:2,y:11,path:[],state:'work',phase:4},marius:{id:'marius',x:6,y:11,path:[],state:'work',phase:5}},

/* ================= saving ================= */
function autosave(){
  if(!G||!RT||SH||G.done)return;
  S.G=G;S.RT=JSON.parse(JSON.stringify(RT,(k,v)=>k==='say'||k==='sayT'||k==='floats'?undefined:v));save();
}
window.addEventListener('pagehide',autosave);
document.addEventListener('visibilitychange',()=>{if(document.hidden)autosave()});

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&RT&&over.hidden){step(dt);checkMeeting();if(RT.tap)RT.tap.t-=dt;if(RT.floats&&!RT.paused)RT.floats=RT.floats.filter(f=>(f.t-=dt)>0);
    if(!frame.h||now-frame.h>400){frame.h=now;renderHUD()}
    if(!frame.s||now-frame.s>5000){frame.s=now;autosave()}}
  if(G&&RT)draw();
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
load();setLang();resize();
if(S.G&&!S.G.done)G=JSON.parse(JSON.stringify(S.G));
showWelcome();
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
