<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Groundwork</title>
<meta name="description" content="Groundwork – vadovavimo žaidimas. Vadovauk komandai biure ir pamatyk pasekmes.">
<meta name="theme-color" content="#0D1217">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Groundwork">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: the office canvas is the stage; a slim HUD sits above it, sheets slide up from the bottom, desktop adds a team sidebar */
*,*::before,*::after{box-sizing:border-box}
:root{
  color-scheme:dark;
  --bg:#0D1217; --surface:#151C23; --raised:#1B242D; --ink:#E7EBEE; --muted:#97A2AD; --line:#26303A; --tint:#1B242D;
  --accent:#C9D7E8; --accent-ink:#0D1217; --focus:#8DB2DE;
  --good:#6CC29C; --bad:#E08A80; --mark:#D2B06E;
  --l-trust:#A3C0E2; --l-conflict:#84A6CF; --l-commitment:#688CB6; --l-accountability:#52739A; --l-results:#415C7C;
  --f-display:"Newsreader",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;letter-spacing:-.015em;line-height:1.12;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}

.app{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;
  padding-left:max(10px, env(safe-area-inset-left,0px));padding-right:max(10px, env(safe-area-inset-right,0px));padding-block:8px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px;font:600 19px/1 var(--f-display);background:none;border:0;padding:4px 0;cursor:pointer}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--surface)}
.lang button{border:0;background:none;font:500 11px/1 var(--f-mono);letter-spacing:.08em;padding:7px 9px;border-radius:6px;color:var(--muted);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--raised);color:var(--ink)}

.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
.game{display:flex;flex-direction:column;gap:8px;min-width:0}
.hud{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.clock{display:flex;flex-direction:column;line-height:1.15}
.clock b{font:600 17px var(--f-mono);font-variant-numeric:tabular-nums}
.clock span{font:500 10.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.gauge{display:flex;flex-direction:column;gap:4px;min-width:0}
.gauge .k{display:flex;justify-content:space-between;gap:6px;font:500 10px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;min-width:0}
.gauge .k span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.gauge .k b{color:var(--ink);font-weight:600;flex:none}
@media (max-width:480px){.hud{grid-template-columns:auto 1fr auto;gap:10px}.hud .gauge:nth-of-type(3){grid-column:2}.hud .hud-btns{grid-row:1 / span 2;grid-column:3}}
.track{display:block;height:4px;background:var(--tint);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.hud-btns{display:flex;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:7px 9px;font:600 12px var(--f-mono);cursor:pointer;min-width:38px}
.ibtn[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.canvas-wrap{position:relative;align-self:center;max-width:100%;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#141A20;touch-action:manipulation}
canvas{display:block;cursor:pointer}
.toast{position:absolute;left:10px;right:10px;top:10px;display:flex;flex-direction:column;gap:6px;pointer-events:none}
.toast div{background:rgba(13,18,23,.92);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13.5px;animation:tin .25s ease both;backdrop-filter:blur(4px)}
.toast div.m{border-color:var(--mark)}
.toast div.m b{color:var(--mark)}
@keyframes tin{from{transform:translateY(-6px);opacity:0}to{transform:none;opacity:1}}
.hint{font-size:13px;color:var(--muted);text-align:center;min-height:20px}
.mobile-team{display:flex;gap:8px}
.mobile-team .ibtn{flex:1;padding:10px;font-size:12.5px}

.side{display:none}
.side .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}

.rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%;cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .who{font-weight:600;font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.prow .st{font:600 13px var(--f-mono);text-align:right}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:600 14px var(--f-display);color:#fff;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ring,var(--line));flex:none}
.av.lg{width:46px;height:46px;font-size:20px}
.chip{display:inline-flex;align-items:center;font:500 10px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 6px;border-radius:5px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.good{border-color:var(--good);color:var(--good)}
.chip.warn{border-color:var(--mark);color:var(--mark)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;max-height:220px;overflow:auto}
.log li{display:grid;grid-template-columns:44px 1fr;gap:8px}
.log .w{font:500 10.5px var(--f-mono);color:var(--muted);padding-top:2px}
.log li.bad .w{color:var(--bad)} .log li.good .w{color:var(--good)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,8,11,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet{width:100%;max-width:560px;max-height:82vh;overflow:auto;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;
  padding:18px max(18px, env(safe-area-inset-left,0px)) 22px max(18px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .25s ease both}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.sheet h2{font-size:25px}
.sheet .lead{font:400 18px/1.45 var(--f-display)}
.who-head{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center}
.who-head .n{font-weight:600;font-size:16px}
.who-head .r{font-size:13px;color:var(--muted)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{display:flex;flex-direction:column;gap:5px}
.mini .k{display:flex;justify-content:space-between;font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.say{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.bubble{background:var(--raised);border-radius:2px 12px 12px 12px;padding:9px 13px;font-size:14.5px;min-width:0}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;width:100%;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:14.5px;line-height:1.4;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center}
.opt:hover{border-color:var(--muted)}
.opt.main{border-color:var(--accent)}
.opt .cost{font:500 10.5px var(--f-mono);color:var(--muted);white-space:nowrap}
.btn{appearance:none;border:1px solid var(--accent);border-radius:10px;background:var(--accent);color:var(--accent-ink);font:600 15px/1.2 var(--f-body);padding:14px 18px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.deltas{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.delta{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.delta b{font:600 13.5px var(--f-mono);color:var(--good)}
.delta b.neg{color:var(--bad)}
.insight{background:var(--raised);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.insight p{font:400 16.5px/1.5 var(--f-display)}
.quote{font:italic 400 18px/1.45 var(--f-display)}

/* full overlays */
.over{position:fixed;inset:0;z-index:30;background:var(--bg);overflow:auto;padding-top:env(safe-area-inset-top,0px)}
.over-in{max-width:620px;margin:0 auto;padding:28px max(20px, env(safe-area-inset-left,0px)) 40px max(20px, env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.over h1{font-size:40px}
.over .lead{font-size:16.5px;color:var(--muted)}
.hero-canvas{width:100%;border-radius:14px;border:1px solid var(--line);display:block}
.typebtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:16px}
.typebtn b{font:500 21px var(--f-display)}
.typebtn span{color:var(--muted);font-size:14px}
.list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.meter.wide{grid-column:1 / -1}
.meter .k{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.meter .v{font:600 19px var(--f-mono)}
.meter .v small{font-size:12px;color:var(--muted)}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.timeline li{display:grid;grid-template-columns:70px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.timeline .w{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.timeline li.bad .w{color:var(--bad)} .timeline li.good .w{color:var(--good)}
.task{border:1px solid var(--ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.task q{font:400 19px/1.4 var(--f-display);quotes:none}
.link{background:none;border:0;padding:4px 0;color:var(--ink);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--muted);align-self:flex-start}

@media (min-width:960px){
  .stage{grid-template-columns:minmax(0,1fr) 300px}
  .side{display:flex;flex-direction:column;gap:12px;position:sticky;top:10px}
  .mobile-team{display:none}
  .scrim{align-items:center}
  .sheet{border-radius:18px;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" id="brand"><svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><polygon points="11,1.5 20.5,8.4 16.9,19.6 5.1,19.6 1.5,8.4" fill="none" stroke="#97A2AD"/><polygon points="11,2.5 16.7,9.6 13.9,15.4 8,17 4.3,9.3" fill="#C9D7E8"/></svg><span>Groundwork</span></button>
    <div class="lang" role="group" aria-label="Kalba / Language"><button data-lang="lt">LT</button><button data-lang="en">EN</button></div>
  </header>
  <div class="stage">
    <section class="game">
      <div class="hud" id="hud"></div>
      <div class="canvas-wrap"><canvas id="cv"></canvas><div class="toast" id="toast"></div></div>
      <p class="hint" id="hint"></p>
      <div class="mobile-team"><button class="ibtn" data-ui="team" id="mteam"></button><button class="ibtn" data-ui="log" id="mlog"></button></div>
    </section>
    <aside class="side" id="side"></aside>
  </div>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="over" id="over" hidden><div class="over-in" id="overIn"></div></div>

<script>
const L=(lt,en)=>({lt,en});

/* ================= content ================= */
const UI={

  week:L('Savaitė','Week'),boss:L('Vadovybė','Leadership'),team:L('Komanda','Team'),log:L('Įvykiai','Events'),

  choose:L('Pasirink komandą','Choose your team'),
  sales:L('Pardavimų komanda','Sales team'),salesD:L('Planas, klientai, premijos','Targets, clients, bonuses'),

  harmonyOk:L('Diskusija gyva: žmonės ginčijasi dėl idėjų.','The discussion is alive: people argue about ideas.'),
  deskH:L('Tavo stalas','Your desk'),

  endEy:L('Savaitė baigta','Week complete'),endFail:L('Žaidimas baigtas','Game over'),

  taskEy:L('Užduotis tavo tikrai komandai','Task for your real team'),commit:L('Įsipareigoju','I commit'),
  committed:L('Įsipareigota. Kitą kartą paklausime, kaip sekėsi.','Committed. We’ll ask next time how it went.'),
  replay:L('Žaisti dar kartą','Play again'),replayNote:L('Motyvacijos sumaišomos iš naujo.','Motivations are reshuffled.'),newTeam:L('Pakeisti komandą','Switch team'),

  ckPartR:L('Gera pradžia. Pabandyk dar kartą.','Good start. Try once more.'),ckNoR:L('Nieko tokio. Užduotis lieka.','That’s fine. The task still stands.'),

const PEOPLE={
  tomas:{n:L('Tomas','Tom'),base:30,stress:35,trust:45,seat:[2,8],shirt:'#3A6EA5',skin:'#E8B896',hair:'#3B2A20',role:{sales:L('Geriausias pardavėjas','Top seller'),project:L('Vyresnysis inžinierius','Senior engineer')}},
  lina:{n:L('Lina','Lena'),f:true,base:22,stress:30,trust:40,seat:[6,8],shirt:'#A0527E',skin:'#F1CDB0',hair:'#7A3B22',long:true,role:{sales:L('Analitikė, rengia pasiūlymus','Analyst, builds proposals'),project:L('Analitikė','Analyst')}},

  egle:{n:L('Eglė','Emma'),f:true,base:14,stress:40,trust:45,seat:[2,11],shirt:'#D48A3A',skin:'#F3D3B8',hair:'#D9B25F',long:true,role:{sales:L('Naujokė','Newcomer'),project:L('Naujokė, testuotoja','Newcomer, QA')}},

const IDS=Object.keys(PEOPLE);

function charAt(id){return id==='player'?RT.player:RT.chars[id]}
function findPath(sx,sy,tx,ty){
  sx=Math.round(sx);sy=Math.round(sy);
  if(!walkable(tx,ty))return null;
  const key=(c,r)=>r*COLS+c,prev=new Map([[key(sx,sy),null]]),q=[[sx,sy]];
  while(q.length){const [c,r]=q.shift();if(c===tx&&r===ty){const p=[];let k=key(c,r);while(k!==key(sx,sy)){p.unshift([k%COLS,Math.floor(k/COLS)]);k=prev.get(k)}return p}
    for(const [dc,dr] of [[1,0],[-1,0],[0,1],[0,-1]]){const nc=c+dc,nr=r+dr;if(walkable(nc,nr)&&!prev.has(key(nc,nr))){prev.set(key(nc,nr),key(c,r));q.push([nc,nr])}}}
  return null;
}
function walkTo(ch,tx,ty){const p=findPath(ch.x,ch.y,tx,ty);if(p){ch.path=p;return true}return false}
function freeSpot(list){const taken=new Set(Object.values(RT.chars).map(c=>{const d=c.path.length?c.path[c.path.length-1]:[Math.round(c.x),Math.round(c.y)];return d.join(',')}));return shuffle(list).find(s=>!taken.has(s.join(',')))||list[0]}

function addMarker(m){m.id=Math.random().toString(36).slice(2);RT.markers.push(m);if(m.kind==='phone')toast(`<b>☎</b> ${t(L('Skambina telefonas tavo kabinete.','The phone is ringing in your office.'))}`);

/* ---- update ---- */
function rate(id){const P=G.people[id];let m=P.stress<40?1:P.stress<70?0.9:0.75;if(P.trait==='resolute')m*=1.15;else if(P.trait)m*=0.55;m*=0.85+0.3*P.trust/100;if(RT.boost&&RT.boost[id])m*=1.15;if(RT.reduce&&RT.reduce[id])m*=0.6;return PEOPLE[id].base*m/6.7}
function tickSim(dm){
  const per=dm/60;
  IDS.forEach(id=>{const P=G.people[id],c=RT.chars[id];if(P.quit||!c)return;
    if((c.state==='work'||c.state==='wait')&&!c.path.length){const r=rate(id)*per;G.out+=r;G.dayOut+=r}
    let s=1.1*per*(G.flags.overload&&G.day<=3?1.4:1);
    if(c.state==='break')s-=1.6*per;
    if(P.trait==='resolute')s/=2;
    P.stress=clamp(P.stress+s,0,100);
    if(P.stress>=100)breakPoint(id)});
  // contagion
  IDS.filter(id=>act(id)&&G.people[id].trait&&G.people[id].trait!=='resolute').forEach(b=>{const cb=RT.chars[b];if(!cb)return;
    IDS.forEach(o=>{if(o===b||!act(o))return;const co=RT.chars[o];if(co&&Math.hypot(co.x-cb.x,co.y-cb.y)<2.2)G.people[o].stress=clamp(G.people[o].stress+0.8*per,0,100)})});
}
function breakPoint(id){
  const P=G.people[id];
  if(P.trait&&P.trait!=='resolute'){P.quit=true;logE('bad',NL(id,' išėjo iš komandos',' left the team'));RT.dayIns.push(NL(id,' išėjo. Lūžęs žmogus be pagalbos ilgai neišbūna.',' quit. A broken person without support doesn’t stay long.'));
    toast(`<b>${esc(pn(id))}</b> ${t(L('išeina iš darbo.','is quitting.'))}`);const c=RT.chars[id];if(c){c.state='leaving';walkTo(c,...SPOT.exit);say(id,L('Viskas. Išeinu.','That’s it. I’m out.'),4)}
    if(IDS.filter(x=>G.people[x].quit).length>=3){G.over='collapse';setTimeout(endWeekNow,1800)}return}
  if(!P.trait&&P.trust>=65&&Math.random()<0.4){P.trait='resolute';P.stress=55;logE('good',NL(id,' atlaikė spaudimą',' held up under pressure'));RT.dayIns.push(NL(id,' atlaikė, nes tavimi pasitiki.',' held up because they trust you.'));toast(`<b>${esc(pn(id))}</b> ${t(L('atlaikė spaudimą ir tapo atsparesnis.','held up and became resolute.'))}`);return}
  if(!P.trait){P.trait=rnd(['cynic','withdrawn','hostile']);P.stress=80;logE('bad',NL(id,' lūžo nuo streso',' broke under stress'));RT.dayIns.push(NL(id,' lūžo. Stresas, kurio niekas nesumažino, pasiekė ribą.',' broke. Stress nobody reduced hit the limit.'));
    toast(`<b>${esc(pn(id))}</b> ${t(L('lūžo nuo streso.','has broken under stress.'))}`);
    mentor('broke',L('Lūžęs žmogus dirba prasčiau ir kelia stresą kitiems. Pokalbis, kuriame tik klausaisi, gali jį susigrąžinti.','A broken person works worse and stresses others. A conversation where you just listen can bring them back.'))}
  else P.stress=90;
}
function updateNPC(c,dm,dt){
  const id=c.id,P=G.people[id];
  if(c.sayT>0)c.sayT-=dt;
  if(c.path.length){moveAlong(c,dt,2.6);if(!c.path.length)arrived(c);return}
  if(c.state==='leaving'){delete RT.chars[id];return}
  if(['wait','meeting','visit','client','fight','held'].includes(c.state)){
    if(c.state==='fight'&&Math.random()<dt*0.5)say(id,rnd([L('Tu nesupranti!','You don’t get it!'),L('Čia mano sritis!','This is my area!'),L('Nesutinku!','I disagree!')]),2);
    if(c.state==='wait'){c.timer-=dm;if(c.timer<=0)sendBack(id)}
    return}
  if(c.state==='break'||c.state==='window'){c.timer-=dm;
    if(c.state==='break'&&Math.random()<dt*0.12){const near=Object.values(RT.chars).find(o=>o!==c&&o.state==='break'&&Math.hypot(o.x-c.x,o.y-c.y)<2.5);
      if(P&&P.trait==='cynic')say(id,rnd(AMB.cynic));else if(near)say(id,rnd(AMB.chat))}
    if(c.timer<=0){c.state='walk';c.next='work';walkTo(c,...PEOPLE[id].seat)}return}
  if(c.state==='work'){c.timer-=dm;
    if(P&&Math.random()<dt*0.04){if(P.trait&&P.trait!=='resolute')say(id,rnd(AMB[P.trait]||AMB.stressed));else if(P.stress>=70)say(id,rnd(AMB.stressed));else if(P.trait==='resolute')say(id,rnd(AMB.resolute));else if(P.trust>=70&&P.stress<40)say(id,rnd(AMB.happy))}
    if(c.timer<=0){c.timer=60+Math.random()*80;
      if(P.trait==='withdrawn')return;
      const go=Math.random()<(0.35+(P.stress>=60?0.3:0));if(!go)return;
      if(P.stress>=80&&Math.random()<0.5){const w=freeSpot(SPOT.window);c.state='walk';c.next='window';c.dur=25+Math.random()*20;walkTo(c,...w);return}
      const k=freeSpot(SPOT.kitchen);c.state='walk';c.next='break';c.dur=20+Math.random()*25;walkTo(c,...k)}}
}
function arrived(c){
  if(c.state==='walk'){c.state=c.next||'work';c.timer=c.state==='work'?60+Math.random()*80:(c.dur||25);if(c.state==='window')say(c.id,AMB.window[0],3)}
  if(c.state==='leaving'){delete RT.chars[c.id]}
}
function moveAlong(c,dt,speed){
  let d=speed*dt;
  while(d>0&&c.path.length){const [tx,ty]=c.path[0],dx=tx-c.x,dy=ty-c.y,dist=Math.hypot(dx,dy);
    if(dist<=d){c.x=tx;c.y=ty;c.path.shift();d-=dist}else{c.x+=dx/dist*d;c.y+=dy/dist*d;d=0}
    if(Math.abs(dx)>0.01)c.face=dx>0?1:-1;c.dir=Math.abs(dy)>Math.abs(dx)?(dy<0?'up':'down'):'side'}
  c.phase=(c.phase||0)+dt*12;
}
function updatePlayer(dt){
  const p=RT.player;if(!p.path.length)return;moveAlong(p,dt,4.2);
  if(!p.path.length&&p.pending){const a=p.pending;p.pending=null;doAction(a)}
}
function step(dtReal){
  if(!G||!RT)return;
  if(RT.paused)return;
  const dm=dtReal*SPEEDS[RT.speed];RT.time+=dm;
  updatePlayer(dtReal);
  Object.values(RT.chars).forEach(c=>updateNPC(c,dm,dtReal));
  tickSim(dm);
  // markers

  RT.markers=RT.markers.filter(m=>{if(RT.time>m.until){m.miss&&m.miss();return false}return true});
  // stressed people come to you
  RT.visitCheck-=dm;if(RT.visitCheck<=0){RT.visitCheck=30;
    const id=IDS.find(id=>act(id)&&RT.chars[id]&&RT.chars[id].state==='work'&&G.people[id].stress>=82&&!RT.talked[id]&&!RT.markers.some(m=>m.who===id)&&!(RT.visited||{})[id]);
    if(id&&RT.time<17*60){RT.visited=RT.visited||{};RT.visited[id]=1;const c=RT.chars[id];c.state='visit';walkTo(c,SPOT.door[0]+1,SPOT.door[1]);
      addMarker({kind:'npc',who:id,ev:'visit',until:RT.time+60,miss:()=>{dS(id,6);dT(id,-6);G.stats.missed++;logE('bad',NL(id,' ieškojo tavęs, bet nesulaukė',' looked for you but you never came'));toast(`<b>${esc(pn(id))}</b> ${t(L('nesulaukė tavęs ir grįžo prie stalo.','gave up waiting and went back.'))}`);sendBack(id)}});
      toast(`<b>${esc(pn(id))}</b> ${t(L('ateina pasikalbėti.','is coming to talk to you.'))}`);
      mentor('visit',L('Kai žmogus pats ateina pas vadovą, tai signalas. Jei jo neišklausysi, kitą kartą jis nebeateis.','When someone comes to you on their own, it’s a signal. Ignore it, and next time they won’t come.'))}}
  const near=IDS.find(id=>act(id)&&G.people[id].stress>=85&&!G.people[id].trait);
  if(near)mentor('near_'+near,NL(near,' arti lūžio. Stresas virš 85. Pasiekęs 100 jis lūš.',' is close to breaking. Stress above 85. At 100 they break.'));

const cv=document.getElementById('cv');let ctx=cv.getContext('2d');
let T=40,OY=24,DPR=1;
function resize(){
  const w=document.querySelector('.game').clientWidth;DPR=Math.min(2,window.devicePixelRatio||1);
  T=Math.max(16,Math.floor(Math.min(w/COLS,(window.innerHeight-190)/(ROWS+0.6))));OY=Math.round(T*0.6);
  const W=T*COLS,H=T*ROWS+OY;cv.width=W*DPR;cv.height=H*DPR;cv.style.height=H+'px';cv.style.width=W+'px';cv.parentElement.style.width=W+'px';
}
window.addEventListener('resize',resize);
cv.addEventListener('click',e=>{
  if(!G||!RT||RT.paused)return;
  const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/T,y=(e.clientY-r.top-OY)/T;
  // characters (drawn about 0.3 tile above their tile centre)
  let best=null,bd=0.7;
  Object.values(RT.chars).forEach(c=>{const d=Math.hypot(c.x+0.5-x,c.y+0.2-y);if(d<bd){bd=d;best=c}});
  if(best&&best.state!=='leaving'){approach({kind:'npc',id:best.id});return}
  const c=Math.floor(x),rr=Math.floor(y);if(rr<0||rr>=ROWS||c<0||c>=COLS)return;
  const ch=MAP[rr][c];
  if(ch==='b'||(c===2&&rr===2)){approach({kind:'desk'});return}
  if(region(c,rr)==='meet'&&(ch==='t'||ch==='m')){approach({kind:'meeting'});return}
  if(walkable(c,rr)){if(walkTo(RT.player,c,rr)){RT.player.pending=null;RT.tap={x:c,y:rr,t:0.6}}}
  else document.getElementById('hint').textContent=u('noPath');
});
function adjacent(tx,ty){
  const p=RT.player,opts=[[tx,ty+1],[tx-1,ty],[tx+1,ty],[tx,ty-1]].filter(([c,r])=>walkable(c,r));
  opts.sort((a,b)=>Math.hypot(a[0]-p.x,a[1]-p.y)-Math.hypot(b[0]-p.x,b[1]-p.y));return opts[0];
}
function approach(a){
  const p=RT.player;let dest;
  if(a.kind==='npc'){const c=RT.chars[a.id];if(!c)return;
    if(c.id!=='client'&&!['visit','fight','meeting'].includes(c.state)){if(c.path.length){c.path=[c.path[0]]}c.prev=c.state==='wait'?c.prev:c.state;c.state='wait';c.timer=40}
    const tx=Math.round(c.path.length?c.path[0][0]:c.x),ty=Math.round(c.path.length?c.path[0][1]:c.y);
    if(Math.hypot(p.x-tx,p.y-ty)<=1.05){doAction(a);return}
    dest=adjacent(tx,ty)}
  else if(a.kind==='desk')dest=SPOT.desk;
  else if(a.kind==='meeting')dest=SPOT.meetP;
  if(!dest||(Math.round(p.x)===dest[0]&&Math.round(p.y)===dest[1])){doAction(a);return}
  if(walkTo(p,dest[0],dest[1]))p.pending=a;
}
function doAction(a){
  if(a.kind==='npc'){
    const m=RT.markers.find(m=>m.who===a.id||m.also===a.id);
    if(m&&typeof m.ev==='number'){RT.markers=RT.markers.filter(x=>x!==m);openEvent(m.ev,a.id);return}
    if(m&&m.ev==='visit'){RT.markers=RT.markers.filter(x=>x!==m)}
    if(a.id==='client')return;
    openPerson(a.id);return}
  if(a.kind==='desk'){const m=RT.markers.find(m=>m.kind==='phone');if(m){RT.markers=RT.markers.filter(x=>x!==m);openEvent(m.ev);return}openDesk();return}
  if(a.kind==='meeting')openMeetingAsk();
}

  const now=performance.now();
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#141A20';ctx.fillRect(0,0,ctx.canvas.width,ctx.canvas.height);ctx.translate(0,OY);
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++)if(!'#W'.includes(MAP[r][c]))floor(c,r);
  if(RT&&RT.tap&&RT.tap.t>0){ctx.strokeStyle='rgba(28,53,80,.6)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(RT.tap.x*T+T/2,RT.tap.y*T+T*0.8,T*0.3*(1.2-RT.tap.t/2),T*0.12,0,0,7);ctx.stroke()}
  const L2=[];
  for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){const ch=MAP[r][c];
    if(ch==='#'||ch==='W')L2.push({y:r+0.99,f:()=>wall(c,r)});
    else if(ch==='d'&&MAP[r][c-1]!=='d')L2.push({y:r+0.7,f:()=>desk(c,r)});
    else if(ch==='b'&&MAP[r][c-1]!=='b')L2.push({y:r+0.7,f:()=>bossDesk(c,r)});
    else if(ch==='t'&&MAP[r][c-1]!=='t'&&MAP[r-1][c]!=='t')L2.push({y:r+1.7,f:()=>table(c,r)});
    else if(ch==='c')L2.push({y:r+0.9,f:()=>counter(c,r)});
    else if(ch==='p')L2.push({y:r+0.9,f:()=>plant(c,r)});}
  IDS.forEach(id=>{const [c,r]=PEOPLE[id].seat;L2.push({y:r+0.3,f:()=>chair(c,r,true)})});
  L2.push({y:2.3,f:()=>chair(2,2,true)});
  SPOT.meet.forEach(([c,r])=>L2.push({y:r+0.3,f:()=>chair(c,r,false)}));
  const tops=[];
  if(RT){
    Object.values(RT.chars).forEach(c=>{const id=c.id,P=G.people[id];
      L2.push({y:c.y+0.62,f:()=>{const seated=id!=='client'&&!c.path.length&&c.state==='work'&&Math.round(c.x)===PEOPLE[id].seat[0]&&Math.round(c.y)===PEOPLE[id].seat[1];
        const res=person(c,LOOK[id],{sit:seated,back:seated||c.dir==='up',type:seated,headphones:P&&P.trait==='withdrawn'});tops.push({c,res,id})}})});
    const p=RT.player;L2.push({y:p.y+0.62,f:()=>{const res=person(p,LOOK.player,{ring:true,back:p.dir==='up'});tops.push({c:p,res,id:'player'})}});
  }
  L2.sort((a,b)=>a.y-b.y).forEach(o=>o.f());
  // names, icons, bubbles
  if(RT){
    tops.forEach(({c,res,id})=>{if(id==='player')return;ctx.font=`500 ${Math.max(9,Math.round(T*0.22))}px IBM Plex Sans, sans-serif`;ctx.textAlign='center';ctx.textBaseline='top';
      ctx.fillStyle='rgba(20,26,32,.75)';ctx.fillText(pn(id),res.px,c.y*T+T*0.86)});
    tops.forEach(({c,res,id})=>{
      const P=G.people[id],mk=RT.markers.find(m=>m.who===id||m.also===id);
      if(mk)iconAbove(res.px,res.top,'!',now);
      else if(P&&!P.quit){if(P.trait==='hostile')iconAbove(res.px,res.top,'anger',now);else if(P.trait==='cynic')iconAbove(res.px,res.top,'dots',now);
        else if(P.stress>=85)iconAbove(res.px,res.top,'storm',now);else if(P.stress>=65)iconAbove(res.px,res.top,'cloud',now);else if(P.trust>=70&&P.stress<35&&Math.sin(now/900+c.phase)>0.6)iconAbove(res.px,res.top,'heart',now)}
      if(c.say&&c.sayT>0)speech(res.px,res.top,tx(c.say))});
    const ph=RT.markers.find(m=>m.kind==='phone');if(ph)iconAbove(3*T+T*0.5,T*0.1,'!',now);
  }
}
function drawHero(){
  const h=document.getElementById('hero');if(!h)return;
  const w=h.clientWidth||560,tT=Math.floor(w/COLS),rows=8.6;
  h.width=tT*COLS*DPR;h.height=Math.round(tT*rows)*DPR;h.style.height=Math.round(tT*rows)+'px';
  const keep={ctx,T,OY,RT,G};
  ctx=h.getContext('2d');T=tT;OY=-tT*5.4;RT=demoRT();
  if(!G)G={type:'sales',people:Object.fromEntries(IDS.map(id=>[id,{stress:30,trust:50}])),culture:{}};
  try{draw()}finally{ctx=keep.ctx;T=keep.T;OY=keep.OY;RT=keep.RT;G=keep.G}
}
/* demo characters for the welcome illustration */
function demoRT(){
  return {time:600,paused:true,speed:0,markers:[],chars:{
    tomas:{id:'tomas',x:2,y:8,path:[],state:'work',phase:1},lina:{id:'lina',x:11,y:12,path:[],state:'break',phase:2,say:L('Kaip savaitgalis?','Good weekend?'),sayT:9},
    darius:{id:'darius',x:12,y:12,path:[],state:'break',phase:3},egle:{id:'egle',x:2,y:11,path:[],state:'work',phase:4},marius:{id:'marius',x:6,y:11,path:[],state:'work',phase:5}},
    player:{x:6,y:9,path:[],dir:'down'}};
}

/* ================= loop ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;
  if(G&&RT&&over.hidden){step(dt);checkMeeting();if(RT.tap)RT.tap.t-=dt;
    if(!frame.h||now-frame.h>400){frame.h=now;renderHUD()}}
  if(G&&RT)draw();
  requestAnimationFrame(frame);
}

/* ================= boot ================= */
load();setLang();resize();
if(S.G&&!S.G.done)G=JSON.parse(JSON.stringify(S.G));
showWelcome();
requestAnimationFrame(frame);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
